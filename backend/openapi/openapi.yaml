          type: string
          nullable: true
          description: 仅官方 / 作者授权分发入口；非空时所属 Mod 的 license 或 license_note 必填（版权红线），本站不镜像分发
        download_note: { type: string, description: 无授权下载入口时的文字说明 }
        file_name: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        source_url: { type: string, nullable: true }
        verified: { type: boolean, description: 是否已核验该版本的来源与下载入口 }
        verify_note: { type: string }
        sort_order: { type: integer }
    Mod:
      type: object
      description: Mod 父条目（TODO §16；仅 review_status = published 对公开接口可见）
      properties:
        id: { type: string }
        slug: { type: string, example: fabric-api }
        name_zh: { type: string, example: Fabric API }
        name_en: { type: string, nullable: true }
        aliases: { type: array, items: { type: string } }
        summary: { type: string }
        description: { type: string }
        categories:
          type: array
          items: { type: string, enum: [ui, optimization, technology, magic, world, adventure, library, storage, decoration, other] }
        loaders: { type: array, items: { type: string, enum: [fabric, forge, neoforge, quilt] } }
        mc_versions: { type: array, items: { type: string }, description: 适用游戏版本声明（单版本 / 区间 / 开上界，如 1.14+） }
        homepage_url: { type: string, nullable: true }
        source_url: { type: string, nullable: true, description: 官方仓库 / 主页，作为可核验锚点 }
        license: { type: string, nullable: true }
        license_note: { type: string }
        game_edition: { type: string, enum: [java, bedrock, both] }
        data_version: { type: string, nullable: true }
        last_verified_at: { type: string, format: date-time, nullable: true }
        review_status: { type: string, enum: [pending, published, rejected] }
        reviewer: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        review_note: { type: string }
        sort_order: { type: integer }
    ModDependency:
      type: object
      description: 一条已记录的依赖 / 冲突关系（TODO §16；只呈现已记录关系，不做自动冲突分析）
      properties:
        id: { type: string }
        mod_id: { type: string }
        dep_kind: { type: string, enum: [required, optional, embedded, incompatible] }
        target_mod_id: { type: string, nullable: true, description: 已收录对方 Mod 的 ID；未收录时为 null }
        target_mod_name: { type: string, description: 未收录对方 Mod 时的展示名（与 target_mod_id 二者必居其一） }
        version_note: { type: string }
        note: { type: string }
        source_url: { type: string, nullable: true, description: 该依赖记录的来源，逐条标注便于核验 }
        verified: { type: boolean }
        target_mod:
          description: 已收录对方 Mod 的摘要；未收录（或已删除）时为 null，前端回退为纯文本名
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ModRef" }]
    ModDependent:
      type: object
      description: 反向依赖：谁依赖了当前 Mod（TODO §16）
      properties:
        dep_kind: { type: string, enum: [required, optional, embedded, incompatible] }
        mod: { $ref: "#/components/schemas/ModRef" }
        version_note: { type: string }
        note: { type: string }
        source_url: { type: string, nullable: true }
        verified: { type: boolean }
    ModDetail:
      description: Mod 详情（本体 + 发布版本 + 依赖与冲突 + 反向依赖，TODO §16）
      allOf:
        - $ref: "#/components/schemas/Mod"
        - type: object
          properties:
            versions: { type: array, items: { $ref: "#/components/schemas/ModVersion" } }
            dependencies: { type: array, items: { $ref: "#/components/schemas/ModDependency" } }
            dependents: { type: array, items: { $ref: "#/components/schemas/ModDependent" } }
    Modpack:
      type: object
      description: 整合包父条目（TODO §16；仅 review_status = published 对公开接口可见）
      properties:
        id: { type: string }
        slug: { type: string, example: fabulously-optimized }
        name_zh: { type: string }
        name_en: { type: string, nullable: true }
        aliases: { type: array, items: { type: string } }
        summary: { type: string }
        description: { type: string }
        mc_version: { type: string, description: 目标游戏版本（精确匹配） }
        loader: { type: string, enum: [fabric, forge, neoforge, quilt, ""] }
        author: { type: string }
        homepage_url: { type: string, nullable: true }
        source_url: { type: string, nullable: true }
        license: { type: string, nullable: true }
        license_note: { type: string }
        data_version: { type: string, nullable: true }
        last_verified_at: { type: string, format: date-time, nullable: true }
        review_status: { type: string, enum: [pending, published, rejected] }
        reviewer: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        review_note: { type: string }
        sort_order: { type: integer }
    ModpackMod:
      type: object
      description: 整合包内的一条 Mod 清单项（TODO §16）
      properties:
        id: { type: string }
        modpack_id: { type: string }
        mod_id: { type: string, nullable: true, description: 已收录 Mod 的 ID；未收录时为 null }
        mod_name: { type: string, description: 未收录 Mod 时的展示名 }
        version: { type: string }
        note: { type: string }
        sort_order: { type: integer }
        mod_ref:
          description: 已收录 Mod 的摘要；未收录（或已删除）时为 null，前端回退为纯文本（不生成死链）
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ModRef" }]
    ModpackDetail:
      description: 整合包详情（本体 + 包内 Mod 清单，TODO §16）
      allOf:
        - $ref: "#/components/schemas/Modpack"
        - type: object
          properties:
            mods: { type: array, items: { $ref: "#/components/schemas/ModpackMod" } }
    LinkHealthItem:
      type: object
      description: 资源链接最新一次检查结果与人工复核状态（TODO §6）
      properties:
        id: { type: string }
        resource_id: { type: string }
        resource_name: { type: string }
        resource_slug: { type: string }
        url: { type: string }
        status: { type: string, enum: [unchecked, ok, redirected, broken, blocked, error] }
        status_code: { type: integer }
        final_url: { type: string }
        trigger_source: { type: string, enum: [auto, manual] }
        review_state: { type: string, enum: [pending, confirmed_broken, confirmed_ok, ignored] }
        reviewed_by: { type: string }
        reviewed_at: { type: string, format: date-time, nullable: true }
        review_note: { type: string }
        checked_at: { type: string, format: date-time }
    LinkHealthRunSummary:
      type: object
      description: 批量链接复查汇总（TODO §6）
      properties:
        checked: { type: integer }
        ok: { type: integer }
        redirected: { type: integer }
        broken: { type: integer }
        blocked: { type: integer }
        error: { type: integer }
        concurrency: { type: integer, description: 本次生效的并发上限 }
        trigger_source: { type: string, enum: [auto, manual] }
    DevApiEntry:
      type: object
      description: 开发文档涉及的关键接口（TODO §21）
      properties:
        name: { type: string, example: "net.fabricmc.api.ModInitializer#onInitialize" }
        kind: { type: string, enum: [class, method, event, field, command, file, plugin] }
        signature: { type: string, description: 签名或用法片段，可为空 }
        note: { type: string }
    DevDocSummary:
      type: object
      description: 开发文档列表条目（不含正文）
      properties:
        slug: { type: string }
        title_zh: { type: string }
        title_en: { type: string }
        loader: { type: string, enum: [neoforge, forge, fabric, vanilla, tooling, multi] }
        category: { type: string, enum: [getting_started, events, registry, networking, datagen, resources, rendering, serialization, api_reference, mapping, toolchain] }
        summary: { type: string }
        mc_versions:
          type: array
          items: { type: string }
          description: 适用版本声明（「自某版本起」如 1.20.1+，或范围 / all）
        loaders: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        api_entry_count: { type: integer, description: 关键接口条数 }
        official_url: { type: string }
        sort_order: { type: integer }
        last_verified_at: { type: string, format: date-time, nullable: true }
    DevDoc:
      description: 开发文档详情
      allOf:
        - $ref: "#/components/schemas/DevDocSummary"
        - type: object
          properties:
            id: { type: string, format: uuid }
            body_md: { type: string, description: Markdown 正文，站内安全渲染 }
            api_entries: { type: array, items: { $ref: "#/components/schemas/DevApiEntry" } }
            source_url: { type: string, description: 可核验来源（可与 official_url 不同） }
            status: { type: string, enum: [draft, published] }
            data_version: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    DevDocDetail:
      type: object
      description: 开发文档详情响应（文档 + 同平台相关条目）
      properties:
        doc: { $ref: "#/components/schemas/DevDoc" }
        related: { type: array, items: { $ref: "#/components/schemas/DevDocSummary" } }
    DevDocFacets:
      type: object
      description: 开发文档筛选维度统计
      properties:
        loaders:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              count: { type: integer }
        categories:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              count: { type: integer }
        total: { type: integer }
    MappingSet:
      type: object
      description: 一套映射数据集（版本 + 映射类型 + 渠道，TODO §21）
      properties:
        id: { type: string, format: uuid }
        set_key: { type: string, description: 数据集唯一键，重复导入按此整体替换 }
        mc_version: { type: string }
        mapping_type: { type: string, enum: [mojang, srg, tsrg, yarn, parchment, mixed] }
        channel: { type: string }
        build_label: { type: string }
        class_count: { type: integer }
        member_count: { type: integer }
        source_url: { type: string }
        license: { type: string }
        note: { type: string, description: 各名字列对应的命名空间说明 }
        imported_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MappingMember:
      type: object
      description: 成员映射（方法 / 字段 / 参数）
      properties:
        kind: { type: string, enum: [method, field, param] }
        obf_name: { type: string, description: 第一命名空间名（混淆 / 官方名） }
        mid_name: { type: string, description: 中间命名空间名（intermediary / SRG） }
        named_name: { type: string, description: 可读名（Yarn named / 官方映射） }
        obf_desc: { type: string, description: 第一命名空间描述符 }
        named_desc: { type: string, description: 可读类型描述符 }
        side: { type: string }
    MappingClassHit:
      type: object
      description: 类命中结果
      properties:
        id: { type: string, format: uuid }
        set_id: { type: string, format: uuid }
        set_key: { type: string }
        mc_version: { type: string }
        mapping_type: { type: string }
        obf_name: { type: string }
        mid_name: { type: string }
        named_name: { type: string }
        package: { type: string }
        member_count: { type: integer }
        matched_members:
          type: array
          description: 命中的成员预览（最多 8 条）
          items: { $ref: "#/components/schemas/MappingMember" }
        matched_total: { type: integer, description: 命中的成员总数（可能大于预览条数） }
    MappingSearchResult:
      type: object
      description: 映射查询结果（含分页与截断标记）
      properties:
        hits: { type: array, items: { $ref: "#/components/schemas/MappingClassHit" } }
        total: { type: integer }
        truncated: { type: boolean, description: 命中集被扫描上限截断时为 true }
        page: { type: integer }
        page_size: { type: integer }
        total_pages: { type: integer }
    MappingClassDetail:
      type: object
      description: 类映射详情与成员列表
      properties:
        class: { $ref: "#/components/schemas/MappingClassHit" }
        members: { type: array, items: { $ref: "#/components/schemas/MappingMember" } }
        member_total: { type: integer }
        set: { $ref: "#/components/schemas/MappingSet" }
    SeedAnalysis:
      type: object
      properties:
        world_seed: { type: string }
        radius: { type: integer }
        structures:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              x: { type: integer }
              z: { type: integer }
              label: { type: string }
        note: { type: string }
    DataQualityCheck:
      type: object
      description: 单项数据质量检查结果（TODO §2 / §4）
      properties:
        key: { type: string, example: items_missing_source }
        label: { type: string, example: 缺少来源 URL }
        category: { type: string, enum: [items, recipes, commands, potions, import] }
        severity: { type: string, enum: [error, warning, info] }
        count: { type: integer, description: 命中问题的条目数 }
        total: { type: integer, description: 该数据域总条目数 }
        hint: { type: string }
    DataQualityOverview:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        checks:
          type: array
          items: { $ref: "#/components/schemas/DataQualityCheck" }
        error_checks: { type: integer, description: 存在严重问题的检查项数 }
        warning_checks: { type: integer, description: 存在提醒的检查项数 }
    DataImportJob:
      type: object
      description: 一次数据导入任务的执行记录
      properties:
        id: { type: string, format: uuid }
        data_type: { type: string, enum: [items, recipes, commands, tools] }
        source_file: { type: string }
        source_version: { type: string }
        dry_run: { type: boolean }
        total_count: { type: integer }
        created_count: { type: integer }
        updated_count: { type: integer }
        skipped_count: { type: integer }
        failed_count: { type: integer }
        error_summary: { type: array, items: { type: string }, nullable: true }
        operator: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

  requestBodies:
    SearchQuery:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              q: { type: string, maxLength: 80, description: 关键词（超长返回 422） }
              type: { type: string, enum: [tool, resource, wiki, item, devdoc], description: devdoc 为开发文档（TODO §21） }
              game_version:
                type: string
                description: |-
                  按游戏版本筛选（TODO §5 / §6-C）：具体版本会命中声明该版本或声明通配 all 的结果；
                  all 仅命中声明了通配的资源；不传表示不限版本。
              sort:
                type: string
                enum: [relevance, updated_desc]
                description: 排序方式，默认 relevance（相关度）
              page: { type: integer, minimum: 1 }
              page_size: { type: integer, minimum: 1, maximum: 50 }
    ResourceListQuery:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              q: { type: string }
              type: { type: string }
              game_version:
                type: string
                description: |-
                  按游戏版本筛选（TODO §6-C）：具体版本会命中声明该版本或声明通配 all 的资源；
                  all 仅命中声明了通配的资源；不传表示不限版本。
              loader: { type: string }
              source_platform: { type: string }
              sort: { type: string, enum: [updated_desc, name_asc] }
              page: { type: integer, minimum: 1 }
              page_size: { type: integer, minimum: 1, maximum: 50 }

  responses:
    Envelope:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {}
    PagedEnvelope:
      description: 成功（含分页 meta）
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: {} }
              meta: { $ref: "#/components/schemas/PageMeta" }
    ValidationError:
      description: 参数校验失败（422）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在（404）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 唯一性冲突（409）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 未登录（401）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 权限不足（403）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: 上游（Mojang API）错误（502）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: 请求过于频繁，触发限流（429）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: 数据源未加载（503）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
