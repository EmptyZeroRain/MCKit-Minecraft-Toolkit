  /admin/gifts/settings/update:
    post:
      tags: [gift]
      summary: 更新签到奖励、签到经验算法与里程碑（需 ops.gifts）
      description: >-
        字段均可选，只更新提交的字段；milestones 传入时整表替换，空数组表示清空。
        补签卡价格单位为签到礼物币，最少 1。
