      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /admin/resources/releases/list:
    post:
      tags: [admin]
      summary: 发布版本列表（TODO §6）
      description: 请求体 `{ id }`，返回该资源的发布版本列表（发布时间降序，未知时间排后）。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ResourceRelease" } }
  /admin/resources/releases/replace:
    post:
      tags: [admin]
      summary: 整体替换发布版本（TODO §6）
      description: |
        请求体 `{ id, releases: [...] }`。以完整列表为准整体替换（幂等），空数组表示清空。
        版本标签必填且资源内唯一、发布页链接必填且为 http(s)、至多一条 is_latest；
        违反返回 422。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, releases]
              properties:
                id: { type: string, format: uuid }
                releases: { type: array, items: { $ref: "#/components/schemas/ResourceReleaseInput" } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ResourceRelease" } }
        "422": { $ref: "#/components/responses/ValidationError" }

