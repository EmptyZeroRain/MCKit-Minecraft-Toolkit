  # ---- 内容历史版本与回滚（gj.md §15 / §16.2）----
  # 权限与对应内容类型一致：resources→content.resources、tools→content.tools、wiki→content.wiki。
  # 回滚通过追加一条 action=rollback 的新版本完成，不覆盖或删除历史。
  /admin/revisions/resources/list:
    post: { tags: [admin], summary: 资源历史版本列表, security: [{ cookieAuth: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RevisionListBody" } } } }, responses: { "200": { $ref: "#/components/responses/PagedEnvelope" } } }
  /admin/revisions/resources/diff:
    post: { tags: [admin], summary: 资源版本差异, security: [{ cookieAuth: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RevisionTargetBody" } } } }, responses: { "200": { $ref: "#/components/responses/Envelope" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /admin/revisions/resources/rollback:
    post: { tags: [admin], summary: 资源回滚到指定版本, security: [{ cookieAuth: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RevisionTargetBody" } } } }, responses: { "200": { $ref: "#/components/responses/Envelope" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /admin/revisions/tools/list:
    post: { tags: [admin], summary: 工具历史版本列表, security: [{ cookieAuth: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RevisionListBody" } } } }, responses: { "200": { $ref: "#/components/responses/PagedEnvelope" } } }
  /admin/revisions/tools/diff:
    post: { tags: [admin], summary: 工具版本差异, security: [{ cookieAuth: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RevisionTargetBody" } } } }, responses: { "200": { $ref: "#/components/responses/Envelope" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /admin/revisions/tools/rollback:
    post: { tags: [admin], summary: 工具回滚到指定版本, security: [{ cookieAuth: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RevisionTargetBody" } } } }, responses: { "200": { $ref: "#/components/responses/Envelope" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /admin/revisions/wiki/list:
    post: { tags: [admin], summary: 百科历史版本列表, security: [{ cookieAuth: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RevisionListBody" } } } }, responses: { "200": { $ref: "#/components/responses/PagedEnvelope" } } }
  /admin/revisions/wiki/diff:
    post: { tags: [admin], summary: 百科版本差异, security: [{ cookieAuth: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RevisionTargetBody" } } } }, responses: { "200": { $ref: "#/components/responses/Envelope" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /admin/revisions/wiki/rollback:
    post: { tags: [admin], summary: 百科回滚到指定版本, security: [{ cookieAuth: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RevisionTargetBody" } } } }, responses: { "200": { $ref: "#/components/responses/Envelope" }, "404": { $ref: "#/components/responses/NotFound" } } }

  /admin/content-tasks/list:
    post:
      tags: [admin]
      summary: 内容建设任务列表（gj.md §8.3 搜索词闭环）
      description: |
        把「无结果搜索词」沉淀为可指派、可跟踪的运营任务。任务只保存归一化关键词与
        聚合计数快照，不含 IP / 会话 / 用户标识。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, in_progress, done, ignored], description: 按处理状态筛选 }
                q: { type: string, description: 关键词模糊过滤 }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 成功（任务列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContentTask" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/content-tasks/candidates:
    post:
      tags: [admin]
      summary: 无结果词候选（达到阈值且尚无未完结任务）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 成功（候选列表；task_id 非空表示该关键词已有未完结任务）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContentTaskCandidate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/content-tasks/create:
    post:
      tags: [admin]
      summary: 从关键词创建内容建设任务
      description: 关键词按搜索词口径归一化；同一关键词只允许一个未完结任务（重复返回 409）。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [keyword]
              properties:
                keyword: { type: string, maxLength: 64 }
                note: { type: string }
                assignee_id: { type: string, format: uuid, description: 负责人（后台账号）；展示名由服务端解析 }
      responses:
        "201": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 该关键词已存在未完结任务 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/content-tasks/update:
    post:
      tags: [admin]
      summary: 更新内容建设任务（状态 / 负责人 / 关联内容 / 备注）
      description: 仅传入的字段生效；assignee_id / related_content_id 传空串表示清空。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentTaskUpdateBody" }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 把任务改回未完结状态时与同关键词任务冲突 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/content-tasks/recheck:
    post:
      tags: [admin]
      summary: 重新检测关键词的搜索结果
      description: 只做检测、不改变任务状态；has_results=true 时可标记完成。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200":
          description: 成功（检测结果）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ContentTaskRecheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/content-tasks/delete:
    post:
      tags: [admin]
      summary: 删除内容建设任务
      description: 仅删除任务本身，不影响搜索统计；纠错用。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/content-health/keywords/list:
    post:
      tags: [admin]
      summary: 内容屏蔽关键字列表（需 ops.dataquality）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: 关键字列表（启用优先）
          content:
