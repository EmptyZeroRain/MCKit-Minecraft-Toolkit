  /admin/audit-logs/list:
    post:
      tags: [admin]
      summary: 审计日志分页查询（admin 专属）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses: { "200": { $ref: "#/components/responses/PagedEnvelope" } }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mc_admin_session

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: 登录/me 返回的 csrf_token，写操作必须与会话一致

  schemas:
    IdBody:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        total_pages: { type: integer }
        suggestions:
          type: array
          items: { type: string }
          description: 无结果搜索时可尝试的关键词（仅 /search 返回，TODO §5）
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
        request_id: { type: string }
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, editor] }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
    UserAccount:
      description: 普通用户账号（不含任何密码信息）
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
    AdminAccount:
      description: 管理员账号（不含任何密码信息）
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, editor] }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LatestVersions:
      type: object
      properties:
        release: { type: string }
        snapshot: { type: string }
    VersionEntry:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [release, snapshot, old_beta, old_alpha] }
        url: { type: string }
        time: { type: string, format: date-time }
        releaseTime: { type: string, format: date-time }
        sha1: { type: string }
    VersionDetail:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        releaseTime: { type: string }
        mainClass: { type: string }
        java:
          type: object
          properties:
            component: { type: string }
            majorVersion: { type: integer }
        downloads:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
              size: { type: integer }
              sha1: { type: string }
        libraries:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
              size: { type: integer }
              sha1: { type: string }
              platforms: { type: string }
        startupCommand: { type: string }
        startupNotes: { type: array, items: { type: string } }
        clientLaunch:
          type: object
          properties:
            mainClass: { type: string }
            command: { type: string }
            gameArgs: { type: array, items: { type: object } }
            jvmArgs: { type: array, items: { type: object } }
            defaultUserJVM: { type: array, items: { type: object } }
    BlockIdEntry:
      type: object
      properties:
        name: { type: string }
        id: { type: string }
        form: { type: string }
        kind: { type: string, enum: [same, different, variant, overlay, special, none, item, other] }
        refId: { type: string }
    SearchResult:
      description: 全站搜索结果条目（url 为前端详情页路径）
      type: object
      properties:
        type: { type: string, enum: [tool, resource, wiki, item, devdoc] }
        id: { type: string }
        slug: { type: string }
        item_id: { type: string, description: 仅物品结果返回 }
        # 开发文档结果（type=devdoc）返回 slug 与 url=/dev/{slug}，item_id 为空。
        title: { type: string }
        summary: { type: string }
        url: { type: string, example: "/items/minecraft:stone" }
        updated_at: { type: string, format: date-time }
    Item:
      description: 统一物品资料（TODO §1）
      type: object
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, example: "minecraft:stone" }
        name_zh: { type: string }
        name_en: { type: string, nullable: true }
        aliases: { type: array, items: { type: string } }
        description: { type: string }
        item_category:
          type: string
          description: 资料类别，决定可选属性（如耐久度）的适用范围
          enum: [block, item, tool, weapon, armor, food, material, other]
        stack_size: { type: integer, nullable: true }
        durability: { type: integer, nullable: true, description: 仅工具 / 武器 / 防具适用 }
        obtain_method: { type: string, description: 获取方式 }
        usage: { type: string, description: 用途 }
        image_url: { type: string, nullable: true }
        game_edition: { type: string, enum: [java, bedrock] }
        supported_versions:
          type: array
          items: { type: string }
          description: 适用版本声明（单版本、范围，或通配 all；all 必须独占）
        source_url: { type: string, nullable: true }
        data_version: { type: string, nullable: true }
        last_verified_at: { type: string, format: date-time, nullable: true, description: 资料最后校验时间 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ItemRecipeLinks:
      type: object
      description: 数据驱动的物品关联配方（无关联时为空数组，不伪造）
      properties:
        produced: { type: array, items: { type: object }, description: 产出该物品的配方 }
        used_as: { type: array, items: { type: object }, description: 以该物品为材料的配方 }
        resolved_items:
          type: object
          description: |
            上述配方引用到的、确实已收录的物品摘要（键为 item_id，TODO §3）。
            未收录物品不会出现在映射中，前端需回退为纯文本 ID，避免断链。
          additionalProperties: { $ref: "#/components/schemas/ItemRef" }
    ItemRef:
      type: object
      description: 关联展示用的物品摘要（仅在后端确认物品已收录时返回，TODO §3）
      properties:
        item_id: { type: string, example: "minecraft:stone" }
        name_zh: { type: string }
        name_en: { type: string, nullable: true }
        item_category:
          type: string
          enum: [block, item, tool, weapon, armor, food, material, other]
        url: { type: string, example: "/items/minecraft:stone" }
    RecipeListEnvelope:
      description: 配方列表（每项附带 resolved_items 关联物品摘要）
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Recipe"
              - type: object
                properties:
                  resolved_items:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/ItemRef" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    Recipe:
      type: object
      properties:
        id: { type: string, format: uuid }
        recipe_key: { type: string }
        recipe_type: { type: string }
        game_version: { type: string }
        supported_versions:
          type: array
          items: { type: string }
          description: 适用版本声明（单版本、范围，或通配 all；TODO §2）
        last_verified_at: { type: string, format: date-time, nullable: true }
        result_item_id: { type: string }
        result_count: { type: integer }
        pattern: { type: array, items: { type: string } }
        key_mapping: { type: object }
        ingredients:
          type: array
          items:
            type: object
            properties:
              item_id: { type: string }
              count: { type: integer }
        requires_crafting_table: { type: boolean }
        source_url: { type: string }
        data_version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SearchTerm:
      type: object
      description: 搜索词匿名聚合统计（TODO §5；不含任何用户标识）
      properties:
        id: { type: string, format: uuid }
        term: { type: string, description: 归一化关键词（小写、折叠空白） }
        hits: { type: integer, description: 被搜索总次数 }
        no_result_hits: { type: integer, description: 其中无结果的次数 }
        failed_hits: { type: integer, description: 查询本身失败的次数（超时 / 服务错误） }
        last_result_count: { type: integer, description: 最近一次的结果数（0 表示无结果） }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    AnalyticsRange:
      type: object
      description: |
        运营看板时间范围。只给 days 表示最近 N 天（含当天，默认 30，上限 366）；
        同时给出 from/to 时以 from/to 为准（YYYY-MM-DD，含首尾）。
      properties:
        from: { type: string, description: 起始日期 YYYY-MM-DD }
        to: { type: string, description: 结束日期 YYYY-MM-DD }
        days: { type: integer, minimum: 1, maximum: 366 }
        limit: { type: integer, minimum: 1, maximum: 500, description: 明细列表条数上限 }
    UsageOverview:
      type: object
      description: 运营概览（TODO §13；全部为聚合计数与比率，不含个人身份信息）
      properties:
        from: { type: string }
        to: { type: string }
        tool_visits: { type: integer }
        tool_uses: { type: integer }
        tool_failures: { type: integer }
        tool_failure_rate: { type: number, description: failures / uses（无使用量时为 0） }
        active_tools: { type: integer }
        resource_views: { type: integer }
        active_resources: { type: integer }
        broken_links: { type: integer, description: 当前失效链接总数（实时查询） }
        search_queries: { type: integer }
        search_zero_result: { type: integer }
        search_failed: { type: integer }
        api_total: { type: integer }
        api_errors: { type: integer, description: 5xx }
        api_client_errors: { type: integer, description: 4xx（不含 429） }
        api_rate_limited: { type: integer, description: 限流触发（429） }
        api_error_rate: { type: number }
        avg_latency_ms: { type: number }
        p95_latency_ms: { type: integer, description: 由固定分桶近似的 P95（桶上界） }
    ToolUsageStat:
      type: object
      properties:
        slug: { type: string }
        visits: { type: integer }
        uses: { type: integer }
        failures: { type: integer }
        fail_rate: { type: number }
    ResourceUsageStat:
      type: object
      properties:
        slug: { type: string }
        views: { type: integer }
    ApiUsageStat:
      type: object
      description: 路由模板级指标（TODO §13），route 为 chi 路由模板而非具体路径
      properties:
        route: { type: string, example: "/api/v1/resources/{slug}" }
        method: { type: string }
        total: { type: integer }
        errors: { type: integer }
        client_errors: { type: integer }
        rate_limited: { type: integer }
        avg_ms: { type: number }
        max_ms: { type: integer }
        p95_ms: { type: integer }
    UsageTrendPoint:
      type: object
      description: 某一天的合并趋势点（缺失日期补零）
      properties:
        date: { type: string }
        tool_visits: { type: integer }
        tool_uses: { type: integer }
        tool_failures: { type: integer }
        resource_views: { type: integer }
        search_queries: { type: integer }
        api_total: { type: integer }
        api_errors: { type: integer }
        api_rate_limited: { type: integer }
    ResourceDependencyType:
      type: string
      description: 依赖关系类型（TODO §6）
      enum: [dependency, prerequisite, conflict]
    ResourceDependency:
      type: object
      description: 依赖项（TODO §6）。历史数据缺少 type 时按 dependency 处理。
      required: [name, type]
      properties:
        name: { type: string, maxLength: 160 }
        type: { $ref: "#/components/schemas/ResourceDependencyType" }
        resource_url: { type: string, nullable: true, description: 可选，必须为 http(s) 链接 }
        required: { type: boolean, description: 冲突项恒为 false }
        note: { type: string, nullable: true, maxLength: 300 }
    ResourceRelease:
      type: object
      description: 同一资源的不同发布版本（TODO §6）
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        version_label: { type: string, maxLength: 120, description: 资源内唯一 }
        game_versions:
          type: array
          items: { type: string }
          description: 该发布适用的游戏版本（单版本、范围，或通配 all）
        loader_types:
          type: array
          items: { type: string }
          enum: [forge, neoforge, fabric, quilt, vanilla, paper, spigot, purpur, other]
        source_url: { type: string, description: 该版本的发布页 / 下载页（http(s)） }
        released_at: { type: string, format: date-time, nullable: true, description: 为空表示时间未知，不做猜测 }
        notes: { type: string }
        is_latest: { type: boolean, description: 同一资源至多一条 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ResourceReleaseInput:
      type: object
      description: 发布版本写入载荷（管理端整体替换）
      required: [version_label, source_url]
      properties:
        version_label: { type: string, maxLength: 120 }
        game_versions: { type: array, items: { type: string } }
        loader_types: { type: array, items: { type: string } }
        source_url: { type: string }
        released_at: { type: string, nullable: true, description: RFC3339 或 YYYY-MM-DD；留空表示未知 }
        notes: { type: string, maxLength: 500 }
        is_latest: { type: boolean }
    ResourceCompatibility:
      type: object
      description: |
        兼容性结论（TODO §6）。结论不落库，由资源级字段与发布版本实时推导；
        verified=false 表示缺少可靠数据依据，界面必须展示「未验证」，不得当作兼容。
      properties:
        verified: { type: boolean }
        game_versions:
          type: array
          items: { type: string }
          description: 适用版本声明（含通配 all 时为 ["all"]）
        loader_types: { type: array, items: { type: string } }
        sources:
          type: array
          items: { type: string, enum: [resource, releases] }
          description: 结论依据来源
        all_versions:
          type: boolean
          description: |
            是否声明了「所有版本」通配（game_versions 含 all，TODO §6-C）。
            前端据此展示「全部 MC 版本」并按官方正式版清单展开完整列表。
        note: { type: string, description: 人工核验备注（resources.compatibility_note） }
        unverified_hint: { type: string, description: 仅 verified=false 时返回 }
    Resource:
      type: object
      description: 资源（TODO §6 统一字段）
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        description: { type: string }
        resource_type:
          type: string
          enum: [mod, modpack, resource_pack, shader, world, datapack, plugin]
        cover_image_url: { type: string, nullable: true }
        author_name: { type: string, nullable: true }
        source_platform: { type: string, nullable: true }
        source_url: { type: string }
        license: { type: string, nullable: true }
        game_edition: { type: string, enum: [java, bedrock] }
        supported_versions:
          type: array
          items: { type: string }
          description: 适用版本声明（单版本、范围，或通配 all；all 必须独占）
        loader_types:
          type: array
          items: { type: string }
          enum: [forge, neoforge, fabric, quilt, vanilla, paper, spigot, purpur, other]
        dependencies: { type: array, items: { $ref: "#/components/schemas/ResourceDependency" } }
        install_guide: { type: string }
        tags: { type: array, items: { type: string } }
        compatibility_note: { type: string, description: 人工核验备注（TODO §6） }
        status: { type: string, enum: [draft, published, hidden, removed] }
        link_status: { type: string, enum: [unchecked, ok, redirected, broken, blocked, error] }
        last_checked_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ResourceDetail:
      description: 资源详情（资源本体 + 发布版本 + 兼容性结论，TODO §6）
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            releases: { type: array, items: { $ref: "#/components/schemas/ResourceRelease" } }
            compatibility: { $ref: "#/components/schemas/ResourceCompatibility" }
    ItemDetail:
      description: 物品详情（物品本体 + 关联配方 + 生成式获取指令）
