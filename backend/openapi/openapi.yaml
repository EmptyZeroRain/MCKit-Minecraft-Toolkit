        attack_note: { type: string, description: 攻击伤害的文字说明（难度 / 版本差异较大，不写死数值） }
        behavior_note: { type: string }
        spawn_note: { type: string, description: 生成条件 }
        taming_note: { type: string, description: 驯服方式 }
        breeding_note: { type: string, description: 繁殖方式 }
        dimensions: { type: array, items: { type: string, enum: [overworld, nether, end] } }
        biomes_note: { type: string }
        summary: { type: string }
        game_edition: { type: string, enum: [java, bedrock, both] }
        supported_versions: { type: array, items: { type: string } }
        source_url: { type: string }
        data_version: { type: string }
        last_verified_at: { type: string, format: date-time, nullable: true }
        sort_order: { type: integer }
    MobDrop:
