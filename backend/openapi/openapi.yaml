      properties:
        id: { type: string }
        drop_key: { type: string }
        mob_slug: { type: string }
        item_id: { type: string, example: "minecraft:raw_beef" }
        item_name_zh: { type: string, example: 生牛肉 }
        count_min: { type: integer }
        count_max: { type: integer }
        chance: { type: number, minimum: 0, maximum: 1, description: 掉落概率，1 表示必定掉落 }
        conditions: { type: string, description: 触发条件（如「被玩家击杀」「用刷子刷取」） }
