    GiftDefinition:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        price: { type: integer }
        stock: { type: integer, description: 总库存；0 表示不限库存 }
        allow_checkin: { type: boolean }
        sort_order: { type: integer }
