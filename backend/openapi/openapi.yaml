  /admin/feedback/reviews:
    post:
      tags: [admin]
      summary: 审核变更历史（TODO §17：记录审核人、审核结果和变更历史）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid, description: 反馈 id }
