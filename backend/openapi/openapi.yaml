  /admin/growth/levels/adjust:
    post:
      tags: [growth]
      summary: 单用户等级调整（需 ops.growth）
      description: 直接用目标等级覆盖用户展示等级，不修改等级曲线与称号规则；覆盖是固定值，后续经验变化不会自动改级，直到下一次人工调整。目标等级必须在 0..max_level 之间；max_level=0 表示不设上限。目标只接受对外用户 ID，不接受内部 UUID 或用户名；普通用户与后台账号均可调整。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id, target_level, reason]
              properties:
                target_user_id: { type: string, description: 对外用户 ID（如 U7K3M2QX9F）；不接受内部 UUID 或用户名 }
