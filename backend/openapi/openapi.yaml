    # ===== 用户成长（growth）=====
    PageQuery:
      type: object
      properties:
        page: { type: integer, minimum: 1, default: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100, default: 20 }

    ToggleBody:
      type: object
      required: [id, enabled]
      properties:
        id: { type: string, format: uuid }
        enabled: { type: boolean }

    GrowthOverview:
      type: object
      properties:
        current_xp: { type: integer, description: 当前有效经验；访客阶段为已攒经验（达到 Lv.1 后生效） }
        lifetime_earned_xp: { type: integer, description: 累计获得 }
        lifetime_reversed_xp: { type: integer, description: 累计冲正 }
        level: { type: integer, description: 等级（仅展示；新用户默认 0，满 7 个活跃日后进入 Lv.1） }
        level_title: { type: string }
        next_level_xp: { type: integer, nullable: true, description: 下一级阈值；满级、访客阶段或人工覆盖时为 null }
        xp_to_next_level: { type: integer }
        level_progress_percent: { type: integer, minimum: 0, maximum: 100 }
        is_max_level: { type: boolean }
        is_level_overridden: { type: boolean, description: 当前等级是否由后台人工直接覆盖 }
        active_days: { type: integer, description: 已累计活跃天数（封顶 guest_active_days） }
        guest_active_days: { type: integer, description: 脱离访客阶段所需活跃天数，当前为 7 }
        guest_pending_xp: { type: integer, description: 访客阶段已攒经验；达到 Lv.1 后自动生效并参与升级 }
        unlocked_achievements: { type: integer }
        achievement_total: { type: integer }
        today_tasks_completed: { type: integer }
        today_tasks_total: { type: integer }
        today_xp: { type: integer }

