          type: object
          description: 本条交易成本物品中确实已收录的物品摘要（键为 item_id）
          additionalProperties: { $ref: "#/components/schemas/ItemRef" }
    VillagerTradeGroup:
      type: object
      description: 按（等级 / 分组）聚合的交易集合
      properties:
        level: { type: integer }
        level_slug: { type: string }
        level_name_zh: { type: string }
        required_experience: { type: integer }
        trade_group: { type: string, enum: [level, purchase, special, ordinary] }
        trades: { type: array, items: { $ref: "#/components/schemas/VillagerTrade" } }
    VillagerProfessionDetail:
      description: 村民职业详情（本体 + 等级规则 + 分组交易 + 关联物品，TODO §9B）
      allOf:
        - $ref: "#/components/schemas/VillagerProfession"
        - type: object
          properties:
            levels: { type: array, items: { $ref: "#/components/schemas/VillagerTradeLevel" } }
            groups: { type: array, items: { $ref: "#/components/schemas/VillagerTradeGroup" } }
            trades: { type: array, items: { $ref: "#/components/schemas/VillagerTrade" } }
            workstation_item: { $ref: "#/components/schemas/ItemRef" }
            resolved_items:
              type: object
              description: 全部交易引用到的、确实已收录的物品摘要（键为 item_id）；未收录者前端回退为纯文本 ID
              additionalProperties: { $ref: "#/components/schemas/ItemRef" }
    Mob:
      type: object
      description: 生物资料（TODO §9C）
      properties:
        id: { type: string }
        slug: { type: string, example: cow }
        name_zh: { type: string, example: 牛 }
        name_en: { type: string, example: Cow }
        aliases: { type: array, items: { type: string } }
        category: { type: string, enum: [passive, neutral, hostile, boss, utility, other] }
