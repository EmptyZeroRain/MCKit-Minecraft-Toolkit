        makeup_cards: { type: integer, description: 购买后的补签卡数量 }
        wallet: { $ref: "#/components/schemas/GiftWallet" }

    GiftMakeupResult:
      type: object
      properties:
        xp_date: { type: string, format: date, description: 被补签的漏签日 }
        xp: { type: integer }
        base_xp: { type: integer }
        streak_xp: { type: integer }
        milestone_xp: { type: integer, description: 补签不触发里程碑，固定为 0 }
        makeup_cards: { type: integer, description: 使用后的补签卡数量 }
