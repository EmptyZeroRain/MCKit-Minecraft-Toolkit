  /admin/wiki/delete:
    post: { tags: [admin], summary: 软删除百科, security: [{ cookieAuth: [] }], parameters: [{ $ref: "#/components/parameters/CsrfToken" }], responses: { "204": { description: 已删除 } } }

  /admin/categories/list:
