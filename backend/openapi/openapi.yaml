      tags: [admin]
      summary: 搜索词统计列表（admin 专属，TODO §5）
      description: |
        匿名化聚合统计：仅关键词与计数，不含 IP、会话或用户标识。
        kind=hot 按搜索次数、no_result 按无结果次数、failed 按查询失败次数。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [hot, no_result, failed], default: hot }
                q: { type: string, description: 关键词模糊过滤 }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 成功（搜索词统计列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchTerm" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/analytics/overview:
    post:
      tags: [admin]
      summary: 运营概览（admin 专属，TODO §13）
      description: |
        按时间范围聚合的使用统计概览：工具访问/使用/失败、资源详情访问、搜索总量与
        无结果/失败、关键 API 请求量/错误率/限流与近似 P95 延迟、当前失效链接总数。
        数据为按天聚合计数，不含任何个人身份信息。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsRange" }
      responses:
        "200":
          description: 成功（运营概览）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UsageOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/analytics/tools:
    post:
      tags: [admin]
      summary: 工具使用明细（admin 专属，TODO §13）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsRange" }
      responses:
        "200":
          description: 成功（按访问+使用总量降序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ToolUsageStat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/analytics/resources:
    post:
      tags: [admin]
      summary: 资源详情访问明细（admin 专属，TODO §13）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsRange" }
      responses:
        "200":
          description: 成功（按访问量降序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ResourceUsageStat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/analytics/api:
    post:
      tags: [admin]
      summary: 关键 API 指标（admin 专属，TODO §13）
      description: |
        按**路由模板**聚合的请求量、错误率、限流触发次数与延迟（平均 / 最大 / 近似 P95）。
        只保存路由模板（如 /api/v1/resources/{slug}），不含具体参数值。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsRange" }
      responses:
        "200":
          description: 成功（按请求量降序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApiUsageStat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/analytics/trend:
    post:
      tags: [admin]
      summary: 按天趋势（admin 专属，TODO §13）
      description: 区间内每一天都存在（缺失日期补零），便于前台绘制连续折线。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsRange" }
      responses:
        "200":
          description: 成功（按日期升序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UsageTrendPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/resources/list:
    post:
      tags: [admin]
      summary: 资源列表（含草稿/下架）
      description: |
        支持关键词、类型、状态、游戏版本、加载器、来源平台、标签筛选。
        `status` 此前后端未接收（静默失效），已修复。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string }
                type: { type: string }
                status: { type: string, enum: [draft, published, hidden, removed] }
                game_version: { type: string }
                loader: { type: string }
                source_platform: { type: string }
                tag: { type: string }
                sort: { type: string, enum: [updated_desc, name_asc] }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { $ref: "#/components/responses/PagedEnvelope" }

  /admin/resources/export:
    post:
      tags: [admin]
      summary: 导出资源 CSV（按列表筛选，最多 5000 条）
      description: |
        与列表共用同一套筛选条件（`filteredQuery`），避免「页面看到的」与「导出的」不一致。
        响应为 `text/csv`（UTF-8 BOM），`X-Export-Truncated: true` 表示超出上限被截断；
        单元格经公式注入防护，导出动作写 `resource.export` 审计。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string }
                type: { type: string }
                status: { type: string }
                game_version: { type: string }
                loader: { type: string }
                source_platform: { type: string }
                tag: { type: string }
                sort: { type: string, enum: [updated_desc, name_asc] }
      responses:
        "200":
          description: CSV 文件
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/resources/detail:
    post:
      tags: [admin]
      summary: 资源详情
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/resources/create:
    post:
      tags: [admin]
      summary: 创建资源
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceInput" }
      responses:
        "201": { $ref: "#/components/responses/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/resources/update:
    post:
      tags: [admin]
      summary: 更新资源（白名单字段）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ResourceInput"
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/resources/unpublish:
    post:
      tags: [admin]
      summary: 下架已发布资源
      description: |
        仅将资源状态改为 `hidden`，资源仍保留在后台列表中，可再次编辑或删除。
        已发布资源必须先下架才能删除；非已发布状态返回 409。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "204": { description: 已下架 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/resources/delete:
    post:
      tags: [admin]
      summary: 删除资源（已发布资源需先下架）
      description: |
        软删除资源并从后台列表隐藏。若资源仍处于 `published` 状态，返回 409，
        调用方需先调用 `/admin/resources/unpublish` 下架。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/resources/check-link:
    post:
      tags: [admin]
      summary: 检查资源来源链接（内置 SSRF 防护）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/resources/releases/list:
    post:
      tags: [admin]
      summary: 发布版本列表（TODO §6）
      description: 请求体 `{ id }`，返回该资源的发布版本列表（发布时间降序，未知时间排后）。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ResourceRelease" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/resources/releases/replace:
    post:
      tags: [admin]
      summary: 整体替换发布版本（TODO §6）
      description: |
        请求体 `{ id, releases: [...] }`。以完整列表为准整体替换（幂等），空数组表示清空。
        版本标签必填且资源内唯一、发布页链接必填且为 http(s)、至多一条 is_latest；
        违反返回 422。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, releases]
              properties:
                id: { type: string, format: uuid }
                releases: { type: array, items: { $ref: "#/components/schemas/ResourceReleaseInput" } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ResourceRelease" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/submissions/list:
    post:
      tags: [admin]
      summary: 资源投稿审核列表（需 content.resources 权限）
      description: 按状态 / 资源类型 / 关键词筛选，新→旧；默认由调用方传 `status=pending`。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, approved, rejected] }
                resource_type:
                  type: string
                  enum: [mod, modpack, resource_pack, shader, world, datapack, plugin]
                q: { type: string, description: 匹配名称 / 简介 / 提交者 }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { $ref: "#/components/responses/PagedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/submissions/detail:
    post:
      tags: [admin]
      summary: 资源投稿详情
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/submissions/review:
    post:
      tags: [admin]
      summary: 审核资源投稿（通过则生成资源）
      description: |
        `status=approved`：按投稿字段调用资源创建链路生成一条 resources 记录，并回填
        `resource_id`；`publish=false`（默认）生成草稿，`publish=true` 直接发布。
        `status=rejected`：仅更新状态与备注，不生成资源。
        投稿已审核时返回 409（SUBMISSION_REVIEWED）；审核人取自登录会话并写入审计日志。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionReviewPayload" }
      responses:
        "200":
          description: 成功，返回审核后的投稿；通过时额外返回生成的资源
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      submission: { $ref: "#/components/schemas/ResourceSubmission" }
                      resource: { $ref: "#/components/schemas/Resource" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 投稿已被审核（SUBMISSION_REVIEWED）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/jobs/types:
    post:
      tags: [admin]
      summary: 已注册的后台任务类型
      description: 前端据此渲染「新建任务」下拉；未注册的类型不允许入队。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: 任务类型列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        desc: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/jobs/list:
    post:
      tags: [admin]
      summary: 分页查询后台任务
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
                type: { type: string }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/jobs/detail:
    post:
      tags: [admin]
      summary: 任务详情（含入参 / 结果 / 失败原因）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/jobs/enqueue:
    post:
      tags: [admin]
      summary: 入队一个后台任务
      description: |
        只做校验与落库，立即返回任务（状态 pending）；执行由服务端调度协程完成。
        未知类型或非法 JSON 参数返回 422。入队写 `job.enqueue` 审计。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string }
                payload: { type: object, description: 任务参数（结构由类型约定） }
      responses:
        "201":
          description: 已入队
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/jobs/retry:
    post:
      tags: [admin]
      summary: 人工重试失败 / 已取消的任务
      description: |
        基于原任务新建一条 pending 任务并记录 `retry_of`，原始失败现场保留。
        仅 failed / cancelled 可重试，其余状态返回 409（JOB_NOT_RETRYABLE）。
        写 `job.retry` 审计。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "201":
          description: 已重新入队
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 当前状态不允许重试（JOB_NOT_RETRYABLE）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/jobs/cancel:
    post:
      tags: [admin]
      summary: 取消排队中的任务
      description: |
        仅 pending 可取消；执行中的任务返回 409（JOB_NOT_CANCELLABLE），
        因为 handler 可能已产生副作用，强行改状态会造成误导。写 `job.cancel` 审计。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 当前状态不允许取消（JOB_NOT_CANCELLABLE）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/alerts/summary:
    post:
      tags: [admin]
      summary: 未关闭告警计数（按状态 / 级别）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AlertSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/alerts/list:
    post:
      tags: [admin]
      summary: 分页查询运营告警（含已关闭历史）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, acked, resolved] }
                severity: { type: string, enum: [warning, error] }
                rule_key: { type: string }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 告警列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OpsAlert" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/alerts/evaluate:
    post:
      tags: [admin]
      summary: 立即评估全部告警规则
      description: |
        定时评估默认每 5 分钟一次；该接口用于「马上看一眼」。
        单条规则失败只记录在 errors 中，不影响其它规则。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: 评估结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AlertEvaluateSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/alerts/ack:
    post:
      tags: [admin]
      summary: 确认告警（open → acked，表示已有人接手）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200":
          description: 已确认
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OpsAlert" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 告警已关闭（ALERT_NOT_OPEN）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/alerts/resolve:
    post:
      tags: [admin]
      summary: 关闭告警并记录原因
      description: 关闭后的告警作为历史保留，不删除；写 `alert.resolve` 审计。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
                note: { type: string, description: 关闭原因（追加到 detail） }
      responses:
        "200":
          description: 已关闭
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OpsAlert" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 告警已关闭（ALERT_NOT_OPEN）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/submissions/batch-review:
    post:
      tags: [admin]
      summary: 批量审核资源投稿（单次最多 50 条）
      description: |
        逐条独立执行 `approved` / `rejected`，返回每条结果；单条失败（如已被他人审核）
        不影响其余记录。`publish=true` 时通过的投稿直接发布，默认生成草稿。
        每条成功记录写一条 `resource_submission.review` 审计（与单条审核粒度一致）。
        请求体超过 50 条或含非法 ID 返回 422。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: uuid }
                status: { type: string, enum: [approved, rejected] }
                note: { type: string }
                publish: { type: boolean, default: false }
      responses:
        "200":
          description: 批量结果（逐条）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BatchReviewResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/mods/batch-review:
    post:
      tags: [admin]
