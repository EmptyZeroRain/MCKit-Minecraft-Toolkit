openapi: 3.1.0
info:
  title: MC 工具站 API
  version: 0.2.0
  description: |
    Minecraft Java 版工具与资源导航站后端 API。

    ## 通用约定
    - 前缀 `/api/v1`；请求/响应 JSON（UTF-8）。
    - **所有查询、搜索、列表接口统一使用 `POST`**，参数放 JSON 请求体。
    - 例外：`robots.txt` / `sitemap.xml` 为 `GET`（爬虫协议要求）。
    - 统一成功结构 `{ "data": ..., "meta": ... }`；错误 `{ "error": {...}, "request_id": "..." }`。
    - 分页 `page` 从 1 开始，`page_size` 默认 20、最大 50（后台列表最大 100）。
    - 管理接口使用 Cookie 会话；写操作需 `X-CSRF-Token` 头（登录/`me` 返回的 `csrf_token`）。
servers:
  - url: /api/v1
tags:
  - name: public
    description: 公开接口
  - name: mc
    description: Minecraft 工具（结构/种子/区块）
  - name: meta
    description: MC 版本信息与物品对照表（移植自 CreeperCode）
  - name: admin-auth
    description: 管理员认证
  - name: user
    description: 普通用户账号与个人数据（需登录，写操作 + CSRF）
  - name: admin
    description: 后台管理（需登录 + CSRF）

paths:
  /health:
    post:
      tags: [public]
      summary: 健康检查
      responses:
        "200": { $ref: "#/components/responses/Envelope" }

  /search:
    post:
      tags: [public]
      summary: 全站搜索（工具/资源/百科/物品/开发文档）
      description: |
        相关度权重：标题 > 命名空间 ID > 别名 > slug > 摘要（TODO §5）。
        搜索范围含开发文档（TODO §21）：命中标题/英文标题/slug/摘要/正文/标签，仅返回已发布条目。
        关键词上限 80 字符，超长返回 422；查询超时 3 秒。
        无结果时 meta.suggestions 返回可尝试的关键词（基于已记录搜索词的字面关系）。
        搜索词以匿名聚合形式记录（关键词 + 次数，不含任何用户标识）。
      requestBody:
        $ref: "#/components/requestBodies/SearchQuery"
      responses:
        "200":
          description: 成功（含分页 meta 与可选 suggestions）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /resources:
    post:
      tags: [public]
      summary: 资源列表（仅已发布）
      requestBody:
        $ref: "#/components/requestBodies/ResourceListQuery"
      responses:
        "200": { $ref: "#/components/responses/PagedEnvelope" }
  /resources/{slug}:
    post:
      tags: [public]
      summary: 资源详情
      description: |
        返回资源本体 + 发布版本 + 兼容性结论（TODO §6）。
        兼容性结论由资源级字段与发布版本实时推导；两者均无数据时 verified=false 并返回 unverified_hint，
        界面必须展示「未验证」，不得当作兼容。
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ResourceDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tools:
    post:
      tags: [public]
      summary: 工具列表（仅已发布）
      responses:
        "200": { $ref: "#/components/responses/PagedEnvelope" }
  /tools/{slug}:
    post:
      tags: [public]
      summary: 工具详情
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }

  /items:
    post:
      tags: [public]
      summary: 物品查询
      description: 按中文名 / 英文名 / 标准 ID / 别名检索统一物品资料库（TODO §1）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 关键词（中文名 / 英文名 / ID / 别名） }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（物品列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /items/{item_id}:
    post:
      tags: [public]
      summary: 物品详情（item_id 含冒号，需 URL 编码）
      description: 返回物品资料、生成式获取指令，以及数据驱动的关联配方（产出 / 作为材料）。
      parameters: [{ name: item_id, in: path, required: true, schema: { type: string, example: "minecraft%3Astone" } }]
      responses:
        "200":
          description: 成功（物品详情）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ItemDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /recipes:
    post:
      tags: [public]
      summary: 合成配方查询
      description: 每项配方附带 resolved_items（TODO §3）：仅包含确实已收录的物品。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                item_id: { type: string }
                game_version:
                  type: string
                  description: 按游戏版本筛选（正式版清单精确匹配；TODO §6-C）
                recipe_type: { type: string }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（配方列表，含关联物品摘要）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeListEnvelope" }

  /potions:
    post:
      tags: [public]
      summary: 药水列表与筛选（TODO §9A）
      description: |
        按名称 / 别名、类别与游戏版本检索药水。版本筛选使用**精确版本语义**：
        目标 1.20 可命中声明「1.8+」的药水，但不会命中「1.21+」。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 关键词（slug / 中文名 / 英文名 / 别名） }
                category:
                  type: string
                  description: 药水类别
                  enum: [water, base, positive, negative, mixed, other]
                version: { type: string, description: 目标游戏版本（如 1.20 / 1.21.1）或 all }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（药水列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Potion" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /potions/rules:
    post:
      tags: [public]
      summary: 通用酿造规则（红石延长 / 萤石增强 / 火药喷溅 / 龙息滞留）
      description: 规则存于数据库（brewing_recipes 中 input / result 均为空的条目），前端不硬编码。
      responses:
        "200":
          description: 成功（规则列表 + 原料摘要）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BrewingRules" }
  /potions/{slug}:
    post:
      tags: [public]
      summary: 药水详情（本体 + 酿造步骤 + 关联物品）
      description: 返回药水本体、酿出该药水的步骤、以该药水为输入的后续步骤，以及确实已收录的原料物品摘要。
      parameters: [{ name: slug, in: path, required: true, schema: { type: string, example: potion-of-healing } }]
      responses:
        "200":
          description: 成功（药水详情）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PotionDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /villagers:
    post:
      tags: [public]
      summary: 村民职业列表与筛选（TODO §9B）
      description: |
        按名称 / 别名、职业类别与游戏版本检索村民职业。版本筛选使用 versioning 的**精确版本语义**：
        目标 1.20 可命中声明「1.14+」的职业，但不会命中声明「1.21+」的条目。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 关键词（slug / 中文名 / 英文名 / 别名 / 工作站名） }
                kind:
                  type: string
                  description: 职业类别
                  enum: [normal, wandering, non_trading]
                version: { type: string, description: 目标游戏版本（如 1.20 / 1.21.1）或 all }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（村民职业列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/VillagerProfession" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /villagers/levels:
    post:
      tags: [public]
      summary: 村民职业等级通用规则（新手 → 大师）
      description: 等级定义存于数据库（villager_trade_levels），前端不硬编码。
      responses:
        "200":
          description: 成功（等级列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/VillagerTradeLevel" } }
  /villagers/{slug}:
    post:
      tags: [public]
      summary: 村民职业详情（本体 + 等级规则 + 分组交易 + 关联物品）
      description: 返回职业本体、全部等级定义、按等级（或收购/特殊/普通）分组的交易，以及确实已收录的物品摘要。
      parameters: [{ name: slug, in: path, required: true, schema: { type: string, example: armorer } }]
      responses:
        "200":
          description: 成功（职业详情）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/VillagerProfessionDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /mobs:
    post:
      tags: [public]
      summary: 生物列表与筛选（TODO §9C）
      description: |
        按名称 / 别名、生物类别与游戏版本检索生物。版本筛选使用 versioning 的**精确版本语义**：
        目标 1.20 可命中声明「1.14+」的生物，但不会命中声明「1.21+」的条目。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 关键词（slug / 中文名 / 英文名 / 别名） }
                category:
                  type: string
                  description: 生物类别
                  enum: [passive, neutral, hostile, boss, utility, other]
                version: { type: string, description: 目标游戏版本（如 1.20 / 1.21.1）或 all }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（生物列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Mob" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /mobs/{slug}:
    post:
      tags: [public]
      summary: 生物详情（本体 + 掉落 + 关联物品）
      description: 返回生物本体、掉落清单（含数量区间与概率），以及确实已收录的掉落物摘要；未收录物品回退为纯文本 ID。
      parameters: [{ name: slug, in: path, required: true, schema: { type: string, example: cow } }]
      responses:
        "200":
          description: 成功（生物详情）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MobDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /redstone/components:
    post:
      tags: [public]
      summary: 红石元件列表与筛选（TODO §15）
      description: |
        按名称 / 别名、元件类别与游戏版本检索红石元件。版本筛选使用 versioning 的**精确版本语义**：
        目标 1.20 可命中声明「1.14+」的元件，但不会命中声明「1.21+」的条目。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 关键词（slug / 中文名 / 英文名 / 别名） }
                category:
                  type: string
                  description: 元件类别
                  enum: [source, transmission, logic, actuator, sensor, other]
                version: { type: string, description: 目标游戏版本（如 1.20 / 1.21.1）或 all }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（红石元件列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RedstoneComponent" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /redstone/components/{slug}:
    post:
      tags: [public]
      summary: 红石元件详情
      description: 返回红石元件本体（核心工作机制与信号说明、适用版本、来源与核验时间）。
      parameters: [{ name: slug, in: path, required: true, schema: { type: string, example: redstone_dust } }]
      responses:
        "200":
          description: 成功（红石元件详情）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RedstoneComponent" }
        "404": { $ref: "#/components/responses/NotFound" }
  /redstone/designs:
    post:
      tags: [public]
      summary: 机器设计列表与筛选（TODO §15）
      description: |
        按名称 / 别名、用途、难度与游戏版本检索机器设计。
        **仅返回 review_status = published 的记录**（内容审核流程：未审核内容不对公开接口可见）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 关键词（slug / 中文名 / 英文名 / 别名 / 作者） }
                purpose:
                  type: string
                  description: 设计用途
                  enum: [farm, sorter, transport, door, logic, utility, other]
                difficulty:
                  type: string
                  description: 难度
                  enum: [easy, medium, hard]
                version: { type: string, description: 目标游戏版本（如 1.20 / 1.21.1）或 all }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（机器设计列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RedstoneDesign" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /redstone/designs/{slug}:
    post:
      tags: [public]
      summary: 机器设计详情（本体 + 材料 + 关联物品）
      description: 返回设计本体、材料清单（含数量区间）与确实已收录的物品摘要；未收录材料回退为纯文本。仅返回已发布设计。
      parameters: [{ name: slug, in: path, required: true, schema: { type: string, example: sugar_cane_farm } }]
      responses:
        "200":
          description: 成功（机器设计详情）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RedstoneDesignDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /mods:
    post:
      tags: [public]
      summary: Mod 列表与筛选（TODO §16）
      description: |
        按名称 / 别名、加载器、类别与游戏版本检索 Mod。版本筛选使用 versioning 的**精确版本语义**：
        目标 1.20 可命中声明「1.14+」的 Mod，但不会命中声明「1.21+」的条目。
        **仅返回 review_status = published 的记录**（内容审核流程：未审核内容不对公开接口可见）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 关键词（slug / 中文名 / 英文名 / 别名） }
                loader:
                  type: string
                  description: 加载器
                  enum: [fabric, forge, neoforge, quilt]
                category:
                  type: string
                  description: 功能类别
                  enum: [ui, optimization, technology, magic, world, adventure, library, storage, decoration, other]
                version: { type: string, description: 目标游戏版本（如 1.20 / 1.21.1）或 all }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（Mod 列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Mod" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /mods/{slug}:
    post:
      tags: [public]
      summary: Mod 详情（本体 + 发布版本 + 依赖与冲突 + 反向依赖）
      description: |
        返回 Mod 本体、发布版本、**已记录**的依赖与冲突（逐条标注 source_url 与 verified）以及反向依赖。
        本站只呈现已记录关系，不做自动冲突分析。仅返回已发布 Mod。
      parameters: [{ name: slug, in: path, required: true, schema: { type: string, example: fabric-api } }]
      responses:
        "200":
          description: 成功（Mod 详情）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ModDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /modpacks:
    post:
      tags: [public]
      summary: 整合包列表与筛选（TODO §16）
      description: |
        按名称 / 别名、加载器与目标游戏版本检索整合包。目标版本为**精确匹配**。
        **仅返回 review_status = published 的记录**。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 关键词（slug / 中文名 / 英文名 / 别名 / 作者） }
                loader:
                  type: string
                  description: 加载器
                  enum: [fabric, forge, neoforge, quilt]
                version: { type: string, description: 目标游戏版本（精确匹配，如 1.21.1） }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（整合包列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Modpack" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /modpacks/{slug}:
    post:
      tags: [public]
      summary: 整合包详情（本体 + 包内 Mod 清单）
      description: 返回整合包本体与包内 Mod 清单；已收录清单项解析为可跳转引用，未收录回退为纯文本（不生成死链）。仅返回已发布整合包。
      parameters: [{ name: slug, in: path, required: true, schema: { type: string, example: fabulously-optimized } }]
      responses:
        "200":
          description: 成功（整合包详情）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ModpackDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dev-docs:
    post:
      tags: [public]
      summary: 开发文档列表与筛选（TODO §21）
      description: |
        按名称 / 主题关键词、平台（加载器）与游戏版本检索开发文档。
        版本筛选使用 versioning 的**精确版本语义**：目标 1.21 可命中声明「1.20.1+」的条目，
        但不会命中声明「1.22+」的条目；声明为 all 的条目对任何版本都命中。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 关键词（slug / 中英文标题 / 摘要 / 标签 / 接口 / 正文） }
                loader:
                  type: string
                  description: 平台 / 加载器（匹配主平台或兼容平台集合）
                  enum: [neoforge, forge, fabric, vanilla, tooling, multi]
                category:
                  type: string
                  description: 主题分类
                  enum: [getting_started, events, registry, networking, datagen, resources, rendering, serialization, api_reference, mapping, toolchain]
                version: { type: string, description: 目标游戏版本（如 1.21.1）或 all }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（开发文档列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DevDocSummary" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /dev-docs/facets:
    post:
      tags: [public]
      summary: 开发文档筛选维度统计（平台 / 主题计数）
      description: 前端据此渲染筛选项与计数，避免把枚举硬编码在页面里。
      responses:
        "200":
          description: 成功（平台与主题计数）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DevDocFacets" }
  /dev-docs/{slug}:
    post:
      tags: [public]
      summary: 开发文档详情（含同平台相关条目）
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: "neoforge-events" }
      responses:
        "200":
          description: 成功（文档详情 + 相关条目）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DevDocDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /mappings/sets:
    post:
      tags: [public]
      summary: 已导入的映射数据集列表（TODO §21）
      description: |
        返回由 `cmd/import-mappings` 导入的数据集（版本 + 映射类型 + 渠道）。
        本站不预置映射数据，列表为空时前端展示导入指引。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string }
                mc_version: { type: string }
                mapping_type:
                  type: string
                  enum: [mojang, srg, tsrg, yarn, parchment, mixed]
      responses:
        "200":
          description: 成功（数据集列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sets: { type: array, items: { $ref: "#/components/schemas/MappingSet" } }
  /mappings/search:
    post:
      tags: [public]
      summary: 映射查询：类 / 方法 / 字段
      description: |
        同一关键词同时匹配 obf（第一命名空间）/ mid（中间命名空间）/ named（可读命名空间）三列。
        结果按类聚合：类名命中优先，仅成员命中的类排在其后；命中的成员以预览形式附带。
        响应未使用通用分页 meta，而是把 truncated（命中集是否被扫描上限截断）与分页字段一并放在 data 中。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 类名或成员名关键词；为空时按数据集顺序浏览 }
                set_id: { type: string, format: uuid, description: 数据集 ID；为空表示跨数据集查询 }
                mc_version: { type: string }
                mapping_type:
                  type: string
                  enum: [mojang, srg, tsrg, yarn, parchment, mixed]
                kind:
                  type: string
                  description: 查询范围
                  enum: [all, class, method, field]
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（类命中列表 + 分页与截断标记）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MappingSearchResult" }
  /mappings/class/{id}:
    post:
      tags: [public]
      summary: 类映射详情与成员列表
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [method, field, param] }
                q: { type: string }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 成功（类映射 + 成员列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MappingClassDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /commands:
    post:
      tags: [public]
      summary: 指令列表与搜索
      responses:
        "200": { $ref: "#/components/responses/PagedEnvelope" }
  /commands/{slug}:
    post:
      tags: [public]
      summary: 指令详情
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }

  /wiki/{slug}:
    post:
      tags: [public]
      summary: 百科详情
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }

  /categories:
    post:
      tags: [public]
      summary: 分类列表
      responses:
        "200": { $ref: "#/components/responses/Envelope" }

  /feedback:
    post:
      tags: [public]
      summary: 提交反馈/举报/投稿（TODO §17）
      description: |
        投稿类型（data_correction 资料纠错 / resource_supplement 资源补充信息）
        须携带当前授权条款版本 license_version，否则返回 422；
        同一来源在 24 小时内重复提交相同内容返回 409；
        related_url 仅接受 http/https 且不得指向本机或内网地址。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [feedback_type, title, content]
              properties:
                feedback_type: { type: string, enum: [bug, resource_broken, infringement, data_correction, resource_supplement, other] }
                title: { type: string, maxLength: 200 }
                content: { type: string, maxLength: 5000 }
                related_url: { type: string, description: 仅接受 http/https 外链 }
                contact: { type: string, maxLength: 200 }
                target_kind: { type: string, enum: [resource, item, dev_doc, mob, villager, potion, tool, other], default: other }
                target_ref: { type: string, maxLength: 200, description: 关联资料标识（slug / item_id） }
                license_version: { type: string, description: 投稿类型必填，当前版本为 2026-10-18 }
      responses:
        "201": { $ref: "#/components/responses/Envelope" }
        "409":
          description: 重复提交（反垃圾）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /versions:
    post:
      tags: [meta]
      summary: MC 版本清单（Mojang manifest，磁盘缓存 7 天）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [release, snapshot, old_beta, old_alpha, all], default: all }
                q: { type: string, description: 按版本 id 模糊搜索 }
      responses:
        "200":
          description: 版本清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      latest: { $ref: "#/components/schemas/LatestVersions" }
                      versions:
                        type: array
                        items: { $ref: "#/components/schemas/VersionEntry" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /versions/detail:
    post:
      tags: [meta]
      summary: 版本详情（下载地址、启动命令、Java 要求、运行库）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, example: "1.21.8" }
      responses:
        "200":
          description: 版本详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/VersionDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /block-ids:
    post:
      tags: [meta]
      summary: 物品 ID 对照表
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string }
                kind: { type: string, enum: [same, different, variant, overlay, special, none, item, other, all] }
      responses:
        "200":
          description: 对照表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      entries:
                        type: array
                        items: { $ref: "#/components/schemas/BlockIdEntry" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /seed/analyze:
    post:
      tags: [mc]
      summary: 种子分析（史莱姆区块 + 结构理论候选坐标）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [seed]
              properties:
                seed: { type: string, description: 数字或文本种子 }
                version: { type: string }
                radius: { type: integer, minimum: 1, maximum: 32, default: 8, description: 区块半径 }
                include_structures: { type: boolean, default: true }
                include_biomes: { type: boolean, default: false, description: 是否返回 1.18+ 群系采样（cubiomes 移植） }
      responses:
        "200":
          description: 分析结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SeedAnalysis" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mc/structures:
    post:
      tags: [mc]
      summary: 结构理论坐标（指定种子与 region 范围）
      description: >-
        返回理论候选坐标；1.18+ 附群系可行性（feasible）。响应含 usable 标注：
        available（该结构是否在版本生成）、placement_supported（分布算法是否与实现一致，
        1.12 及更早为 false）、supported 为二者与。单次计算限时 3s。
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /mc/structures/types:
    post:
      tags: [mc]
      summary: 支持的结构类型清单与参数描述（版本、维度、频率门槛、群系约束）
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /mc/capabilities:
    post:
      tags: [mc]
      summary: 世界分析工具各能力的版本支持矩阵
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /mc/biome:
    post:
      tags: [mc]
      summary: 生物群系查询（仅 1.18+；其他版本返回 supported=false 与说明）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [seed, x, z]
              properties:
                seed: { type: string }
                x: { type: integer, description: 方块 X 坐标 }
                z: { type: integer, description: 方块 Z 坐标 }
                version: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /mc/strongholds:
    post:
      tags: [mc]
      summary: 要塞位置估算
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /mc/slime-chunks:
    post:
      tags: [mc]
      summary: 史莱姆区块查询（仅 Java 版；单次计算限时 3s）
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /mc/seeds/generate:
    post:
      tags: [mc]
      summary: 生成随机种子
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /mc/seeds/find:
    post:
      tags: [mc]
      summary: 按结构位置搜索种子
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /mc/seeds/parse:
    post:
      tags: [mc]
      summary: 解析种子文本为数值
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /mc/region/inspect:
    post:
      tags: [mc]
      summary: 解析上传的 .mca 区域文件，返回区块清单、统计与只读诊断
      description: >-
        仅内存解析、不落盘（上限 64MiB）。响应含 stats（文件/扇区/压缩/时间戳统计）与
        diagnosis（区分确定错误 error 与警告 warning；只读检查，不含自动修复）。
        逐区块 NBT 解析超过 5s 时提前结束并置 timed_out=true。
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /mc/region/chunk:
    post:
      tags: [mc]
      summary: 返回指定区块的顶层 NBT 字段
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                local_x: { type: integer }
                local_z: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /mc/level/parse:
    post:
      tags: [mc]
      summary: 解析 level.dat，返回世界基础信息与只读诊断
      description: >-
        仅内存解析、不落盘（上限 64MiB，解压输出上限 16MiB）。解析 gzip 压缩或未压缩的 NBT；
        返回 world（世界名称、种子、版本、出生点、游戏规则等）与 warnings（告警，非确定错误）。
        不修改存档、不提供自动修复。
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /user/register:
    post:
      tags: [user]
      summary: 注册普通用户（注册后需登录）
      description: >-
        用户名 3-40 位、以字母开头，仅含字母/数字/下划线/连字符；密码至少 8 位。
        密码使用 Argon2id 哈希存储，不保存明文。注册不自动登录。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "409":
          description: 用户名已被占用
        "422": { $ref: "#/components/responses/ValidationError" }
  /user/login:
    post:
      tags: [user]
      summary: 用户登录
      description: 成功时种下 HttpOnly 会话 Cookie（默认 mc_user_session），并在响应中返回 csrf_token。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: 登录成功（种下会话 Cookie，返回用户信息与 csrf_token）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UserAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: 登录尝试过多（按用户名 + IP 限流）
  /user/logout:
    post:
      tags: [user]
      summary: 退出登录
      security: [{ cookieAuth: [] }]
      responses:
        "204": { description: 已退出 }
  /user/me:
    post:
      tags: [user]
      summary: 当前用户信息（含 csrf_token）
      security: [{ cookieAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /user/change-password:
    post:
      tags: [user]
      summary: 修改密码（需 CSRF；成功后全部会话失效）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "204": { description: 已修改，需重新登录 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /user/delete:
    post:
      tags: [user]
      summary: 删除账号及其全部个人数据（需 CSRF + 密码确认）
      description: 级联删除收藏、最近使用与常用种子，操作不可恢复。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: 账号已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /user/favorites/list:
    post:
      tags: [user]
      summary: 收藏列表（按发布时间倒序）
      security: [{ cookieAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /user/favorites/toggle:
    post:
      tags: [user]
      summary: 收藏 / 取消收藏（需 CSRF）
      description: 幂等切换；kind 取值 tool / item / resource / wiki。上限 500 条。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind, object_id]
              properties:
                kind: { type: string, enum: [tool, item, resource, wiki] }
                object_id: { type: string }
                label: { type: string }
                url: { type: string }
      responses:
        "200":
          description: 操作后的收藏状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      favorited: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /user/favorites/remove:
    post:
      tags: [user]
      summary: 取消收藏（需 CSRF，幂等）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind, object_id]
              properties:
                kind: { type: string, enum: [tool, item, resource, wiki] }
                object_id: { type: string }
      responses:
        "204": { description: 已取消 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /user/recents/list:
    post:
      tags: [user]
      summary: 最近使用列表（最多保留最近 50 条）
      security: [{ cookieAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /user/recents/record:
    post:
      tags: [user]
      summary: 记录一次最近使用（需 CSRF，重复对象自动前置）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind, object_id]
              properties:
                kind: { type: string, enum: [tool, item, resource, wiki] }
                object_id: { type: string }
                label: { type: string }
                url: { type: string }
      responses:
        "204": { description: 已记录 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /user/recents/clear:
    post:
      tags: [user]
      summary: 清空最近使用（需 CSRF）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: 已清空 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /user/seeds/list:
    post:
      tags: [user]
      summary: 常用种子列表（上限 200 条）
      security: [{ cookieAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /user/seeds/save:
    post:
      tags: [user]
      summary: 新建 / 更新常用种子（需 CSRF）
      description: id 为空表示新建，否则更新本人对应的记录；种子以字符串保存，避免大整数丢精度。
