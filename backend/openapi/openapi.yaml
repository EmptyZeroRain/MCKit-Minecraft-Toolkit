      description: 资源投稿请求体（结构化字段，与资源中心对齐）
      type: object
      required: [name, summary, resource_type, source_url, license_version]
      properties:
        name: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        description: { type: string, description: 资源描述（审核通过后作为资源正文） }
        resource_type:
          type: string
          enum: [mod, modpack, resource_pack, shader, world, datapack, plugin]
        author_name: { type: string, maxLength: 160 }
        source_platform: { type: string, maxLength: 100 }
        source_url: { type: string, format: uri, maxLength: 2000, description: 资源原始来源链接（仅 http/https，≤2000 字符） }
        license: { type: string, maxLength: 160 }
        game_edition: { type: string, enum: [java, bedrock], default: java }
        supported_versions: { type: array, items: { type: string } }
        loader_types: { type: array, items: { type: string } }
        install_guide: { type: string }
        note: { type: string, maxLength: 2000, description: 给审核者的说明（不写入资源） }
        license_version:
          type: string
          description: 投稿授权条款版本，须等于后端当前版本（见 domain.SubmissionLicenseVersion）
