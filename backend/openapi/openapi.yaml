  /admin/tags/create:
    post: { tags: [admin], summary: 创建标签, security: [{ cookieAuth: [] }], parameters: [{ $ref: "#/components/parameters/CsrfToken" }], responses: { "201": { $ref: "#/components/responses/Envelope" } } }
  /admin/tags/update:
    post: { tags: [admin], summary: 更新标签, security: [{ cookieAuth: [] }], parameters: [{ $ref: "#/components/parameters/CsrfToken" }], responses: { "200": { $ref: "#/components/responses/Envelope" } } }
  /admin/tags/delete:
    post: { tags: [admin], summary: 删除标签, security: [{ cookieAuth: [] }], parameters: [{ $ref: "#/components/parameters/CsrfToken" }], responses: { "204": { description: 已删除 } } }

  /admin/feedback/list:
    post: { tags: [admin], summary: 反馈列表, security: [{ cookieAuth: [] }], responses: { "200": { $ref: "#/components/responses/PagedEnvelope" } } }
  /admin/feedback/update:
    post:
      tags: [admin]
      summary: 审核反馈/投稿（更新状态 + 审核备注，记录审核人与变更历史）
      security: [{ cookieAuth: [] }]
