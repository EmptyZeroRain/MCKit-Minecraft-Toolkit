components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      # 统一会话 Cookie（迁移 0022）：管理员与普通用户共用，名字由 SESSION_COOKIE_NAME 配置。
      name: mc_session

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: 登录/me 返回的 csrf_token，写操作必须与会话一致

  schemas:
    QualityIssueState:
      type: object
      description: 数据质量问题的人工处理状态（检查结果实时计算，处理状态持久化）
      required: [status, assignee_name, note, snapshot_count]
      properties:
        status: { type: string, enum: [open, assigned, resolved, ignored] }
        assignee_id: { type: string, format: uuid }
        assignee_name: { type: string, description: 负责人昵称快照 }
        note: { type: string }
        snapshot_count: { type: integer, description: 处理时的问题条数快照 }
        resolved_at: { type: string, format: date-time, nullable: true }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    OpsAlert:
      type: object
      description: |
        运营告警。同一规则未关闭期间只保留一条（指标持续异常只刷新 last_seen_at），
        关闭后保留为历史。
      required: [id, rule_key, severity, status, title, triggered_at]
      properties:
        id: { type: string, format: uuid }
        rule_key: { type: string }
        severity: { type: string, enum: [warning, error] }
        status: { type: string, enum: [open, acked, resolved] }
        title: { type: string }
        detail: { type: string }
        metric: { type: object, description: 触发时的指标快照 }
        dedupe_key: { type: string }
        triggered_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        acked_by: { type: string }
        acked_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string }
        resolved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertSummary:
      type: object
      properties:
        open: { type: integer }
        acked: { type: integer }
        error: { type: integer, description: 未关闭且严重的告警数 }
        warning: { type: integer }
    AlertEvaluateSummary:
      type: object
      properties:
        evaluated: { type: integer }
        triggered: { type: integer, description: 本次新建的告警数 }
        refreshed: { type: integer, description: 已存在并刷新的告警数 }
        auto_closed: { type: integer, description: 指标恢复后自动关闭的告警数 }
        errors:
          type: array
          items: { type: string }
    AdminJob:
      type: object
      description: |
        后台运维任务（gj.md 阶段二）。任务与 HTTP 请求解耦：接口只入队，
        由服务端调度协程执行；失败先自动重试，仍失败保留 last_error 供人工重试。
      required: [id, type, status, attempts, max_attempts]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: 任务类型（见 /admin/jobs/types） }
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        payload: { type: object, description: 任务入参 }
        result: { type: object, description: 任务产出摘要（脱敏） }
        attempts: { type: integer, description: 已执行次数（含自动重试） }
        max_attempts: { type: integer, description: 自动重试上限 }
        last_error: { type: string, description: 最近一次失败原因（已脱敏） }
        retry_of: { type: string, format: uuid, description: 人工重试来源任务 ID }
        created_by: { type: string }
        next_run_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BatchItemResult:
      type: object
      description: 批量操作中单条记录的处理结果（逐条独立事务）
      required: [id, ok]
      properties:
        id: { type: string, description: 记录 ID }
        label: { type: string, description: 可读名称（资源名 / Mod 名等），失败时可能为空 }
        ok: { type: boolean, description: 是否成功 }
        error: { type: string, description: 失败原因（已脱敏，可直接展示） }
    BatchReviewResult:
      type: object
      description: |
        批量审核汇总。后端**逐条独立事务**：单条失败不影响其余记录，
        因此必须展示 succeeded / failed 与 items 明细（部分成功是正常情况）。
      required: [requested, succeeded, failed, items]
      properties:
        requested: { type: integer, description: 去重后的请求条数 }
        succeeded: { type: integer }
        failed: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/BatchItemResult" }
    IdBody:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    RevisionListBody:
      type: object
      required: [content_id]
      properties:
        content_id: { type: string, format: uuid, description: 内容对象 ID }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 50 }
    RevisionTargetBody:
      type: object
      required: [content_id, revision_no]
      properties:
        content_id: { type: string, format: uuid }
        revision_no: { type: integer, minimum: 1, description: 目标历史版本号 }
        note: { type: string, description: 回滚备注（仅 rollback 使用） }
    ContentTask:
      type: object
      description: 内容建设任务（gj.md §8.3 搜索词闭环 / §15 内容任务）
      properties:
        id: { type: string, format: uuid }
        keyword: { type: string, description: 归一化搜索词（与 search_terms.term 同口径） }
        search_term_id: { type: string, format: uuid, nullable: true, description: 关联的搜索词统计行 }
        hits: { type: integer, description: 创建时搜索总次数快照 }
        no_result_hits: { type: integer, description: 创建时无结果次数快照 }
        last_seen_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [open, in_progress, done, ignored] }
