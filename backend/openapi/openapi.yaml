      responses:
        "200":
          description: 批量结果（逐条）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BatchReviewResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/redstone/designs/batch-review:
    post:
      tags: [admin]
      summary: 批量审核红石设计（单次最多 50 条）
      description: 逐条独立执行，返回每条结果；每条成功记录写 `redstone_design.review` 审计。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, review_status]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: uuid }
                review_status: { type: string, enum: [pending, published, rejected] }
                note: { type: string }
      responses:
        "200":
          description: 批量结果（逐条）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BatchReviewResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

