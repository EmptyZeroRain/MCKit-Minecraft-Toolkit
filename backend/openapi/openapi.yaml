      description: 依赖项（TODO §6）。历史数据缺少 type 时按 dependency 处理。
      required: [name, type]
      properties:
        name: { type: string, maxLength: 160 }
        type: { $ref: "#/components/schemas/ResourceDependencyType" }
        resource_url: { type: string, nullable: true, description: 可选，必须为 http(s) 链接 }
        required: { type: boolean, description: 冲突项恒为 false }
        note: { type: string, nullable: true, maxLength: 300 }
    ResourceRelease:
      type: object
      description: 同一资源的不同发布版本（TODO §6）
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        version_label: { type: string, maxLength: 120, description: 资源内唯一 }
        game_versions:
          type: array
          items: { type: string }
          description: 该发布适用的游戏版本（单版本、范围，或通配 all）
        loader_types:
          type: array
          items: { type: string }
          enum: [forge, neoforge, fabric, quilt, vanilla, paper, spigot, purpur, other]
        source_url: { type: string, description: 该版本的发布页 / 下载页（http(s)） }
        released_at: { type: string, format: date-time, nullable: true, description: 为空表示时间未知，不做猜测 }
        notes: { type: string }
        is_latest: { type: boolean, description: 同一资源至多一条 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ResourceReleaseInput:
      type: object
      description: 发布版本写入载荷（管理端整体替换）
      required: [version_label, source_url]
      properties:
        version_label: { type: string, maxLength: 120 }
        game_versions: { type: array, items: { type: string } }
        loader_types: { type: array, items: { type: string } }
        source_url: { type: string }
        released_at: { type: string, nullable: true, description: RFC3339 或 YYYY-MM-DD；留空表示未知 }
        notes: { type: string, maxLength: 500 }
        is_latest: { type: boolean }
    ResourceCompatibility:
      type: object
      description: |
        兼容性结论（TODO §6）。结论不落库，由资源级字段与发布版本实时推导；
        verified=false 表示缺少可靠数据依据，界面必须展示「未验证」，不得当作兼容。
      properties:
        verified: { type: boolean }
        game_versions:
          type: array
          items: { type: string }
          description: 适用版本声明（含通配 all 时为 ["all"]）
        loader_types: { type: array, items: { type: string } }
        sources:
          type: array
          items: { type: string, enum: [resource, releases] }
          description: 结论依据来源
        all_versions:
          type: boolean
          description: |
            是否声明了「所有版本」通配（game_versions 含 all，TODO §6-C）。
            前端据此展示「全部 MC 版本」并按官方正式版清单展开完整列表。
        note: { type: string, description: 人工核验备注（resources.compatibility_note） }
        unverified_hint: { type: string, description: 仅 verified=false 时返回 }
    Resource:
      type: object
      description: 资源（TODO §6 统一字段）
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        description: { type: string }
        resource_type:
          type: string
          enum: [mod, modpack, resource_pack, shader, world, datapack, plugin]
        cover_image_url: { type: string, nullable: true }
        author_name: { type: string, nullable: true }
        source_platform: { type: string, nullable: true }
        source_url: { type: string }
        license: { type: string, nullable: true }
        game_edition: { type: string, enum: [java, bedrock] }
        supported_versions:
          type: array
          items: { type: string }
          description: 适用版本声明（单版本、范围，或通配 all；all 必须独占）
        loader_types:
          type: array
          items: { type: string }
          enum: [forge, neoforge, fabric, quilt, vanilla, paper, spigot, purpur, other]
        dependencies: { type: array, items: { $ref: "#/components/schemas/ResourceDependency" } }
        install_guide: { type: string }
        tags: { type: array, items: { type: string } }
        compatibility_note: { type: string, description: 人工核验备注（TODO §6） }
        status: { type: string, enum: [draft, published, hidden, removed] }
        link_status: { type: string, enum: [unchecked, ok, redirected, broken, blocked, error] }
        last_checked_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ResourceDetail:
      description: 资源详情（资源本体 + 发布版本 + 兼容性结论，TODO §6）
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            releases: { type: array, items: { $ref: "#/components/schemas/ResourceRelease" } }
            compatibility: { $ref: "#/components/schemas/ResourceCompatibility" }
    ItemDetail:
      description: 物品详情（物品本体 + 关联配方 + 生成式获取指令）
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          properties:
            related_recipes: { $ref: "#/components/schemas/ItemRecipeLinks" }
            obtain_command: { type: string, example: "/give @s minecraft:stone 1" }
    PotionEffect:
      type: object
      description: 药水单条效果（普通 / 延长 / 增强各一条，TODO §9A）
      properties:
        variant: { type: string, enum: [normal, extended, enhanced] }
        effect_id: { type: string, example: "minecraft:speed" }
        name_zh: { type: string }
        name_en: { type: string }
        amplifier: { type: integer, minimum: 1, description: "等级：1 表示 I 级" }
        duration_seconds: { type: integer, minimum: 0, description: 0 表示瞬间效果 }
        description: { type: string }
    Potion:
      description: 药水资料（TODO §9A）
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: potion-of-healing }
        name_zh: { type: string }
        name_en: { type: string, nullable: true }
        aliases: { type: array, items: { type: string } }
        category: { type: string, enum: [water, base, positive, negative, mixed, other] }
        summary: { type: string }
        effect_note: { type: string, description: 效果补充说明（如版本差异、特殊用途） }
        is_brewable: { type: boolean, description: 是否可通过酿造获得 }
        is_extendable: { type: boolean, description: 能否用红石粉延长 }
        is_enhanceable: { type: boolean, description: 能否用荧石粉增强 }
        effects: { type: array, items: { $ref: "#/components/schemas/PotionEffect" } }
        game_edition: { type: string, enum: [java, bedrock, both] }
        supported_versions:
          type: array
          items: { type: string }
          description: 适用版本声明（「自某版本起」如 1.8+，或范围 / all）
        source_url: { type: string, nullable: true }
        data_version: { type: string, nullable: true }
        last_verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PotionRef:
      type: object
      description: 关联展示用的药水摘要
      properties:
        slug: { type: string }
        name_zh: { type: string }
        category: { type: string, enum: [water, base, positive, negative, mixed, other] }
        url: { type: string, example: "/potions/potion-of-healing" }
    BrewingStep:
      type: object
      description: 酿造步骤（TODO §9A）
      properties:
        id: { type: string, format: uuid }
        recipe_key: { type: string }
        step_kind: { type: string, enum: [base, effect, corrupt, modifier, form] }
        input_potion_slug: { type: string, nullable: true, description: 为空表示从水瓶起步（或通用规则） }
        ingredient_item_id: { type: string, example: "minecraft:nether_wart" }
        ingredient_name_zh: { type: string }
        result_potion_slug: { type: string, nullable: true, description: 为空表示通用修饰 / 形态规则 }
        note: { type: string }
        game_edition: { type: string, enum: [java, bedrock, both] }
        supported_versions: { type: array, items: { type: string } }
        source_url: { type: string, nullable: true }
        sort_order: { type: integer }
        input_potion: { $ref: "#/components/schemas/PotionRef" }
        result_potion: { $ref: "#/components/schemas/PotionRef" }
    BrewingRules:
      type: object
      description: 通用酿造规则（红石延长 / 萤石增强 / 火药喷溅 / 龙息滞留）
      properties:
        rules: { type: array, items: { $ref: "#/components/schemas/BrewingStep" } }
        ingredient_items:
          type: object
          description: 规则原料中确实已收录的物品摘要（键为 item_id）
          additionalProperties: { $ref: "#/components/schemas/ItemRef" }
    PotionDetail:
      description: 药水详情（本体 + 酿造步骤 + 通用规则 + 关联物品，TODO §9A）
      allOf:
        - $ref: "#/components/schemas/Potion"
        - type: object
          properties:
            produced_by: { type: array, items: { $ref: "#/components/schemas/BrewingStep" } }
            follow_ups: { type: array, items: { $ref: "#/components/schemas/BrewingStep" } }
            rules: { type: array, items: { $ref: "#/components/schemas/BrewingStep" } }
            ingredient_items:
              type: object
              description: 步骤原料中确实已收录的物品摘要（键为 item_id）；未收录者前端回退为纯文本 ID
              additionalProperties: { $ref: "#/components/schemas/ItemRef" }
    VillagerProfession:
      description: 村民职业资料（TODO §9B）
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: armorer }
        name_zh: { type: string }
        name_en: { type: string, nullable: true }
        aliases: { type: array, items: { type: string } }
        kind: { type: string, enum: [normal, wandering, non_trading] }
        workstation_item_id: { type: string, nullable: true, example: "minecraft:blast_furnace" }
        workstation_name_zh: { type: string }
        summary: { type: string }
        description: { type: string }
        trade_note: { type: string, description: 交易机制说明（价格浮动、随机附魔等） }
        game_edition: { type: string, enum: [java, bedrock, both] }
        supported_versions: { type: array, items: { type: string } }
        source_url: { type: string, nullable: true }
        data_version: { type: string, nullable: true }
        last_verified_at: { type: string, format: date-time, nullable: true }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VillagerTradeLevel:
      description: 村民职业等级定义（通用规则，TODO §9B）
      type: object
      properties:
        id: { type: string, format: uuid }
        level: { type: integer, minimum: 1, maximum: 5 }
        slug: { type: string, example: journeyman }
        name_zh: { type: string, example: 老手 }
        name_en: { type: string, nullable: true }
        required_experience: { type: integer, description: 升级所需累计交易经验 }
        badge_note: { type: string }
    VillagerCostItem:
      type: object
      description: 交易中「村民想要」的单条物品（数量为区间，固定数量时 min == max）
      properties:
        item_id: { type: string, example: "minecraft:emerald" }
        name_zh: { type: string }
        count_min: { type: integer, minimum: 1 }
        count_max: { type: integer, minimum: 1 }
    VillagerTrade:
      description: 一条村民交易（TODO §9B）
      type: object
      properties:
        id: { type: string, format: uuid }
        trade_key: { type: string }
        profession_slug: { type: string }
        level: { type: integer, description: 0 表示不分等级（流浪商人） }
        trade_group: { type: string, enum: [level, purchase, special, ordinary] }
        cost_items: { type: array, items: { $ref: "#/components/schemas/VillagerCostItem" } }
        result_item_id: { type: string }
        result_item_name_zh: { type: string }
        result_count: { type: integer }
