        manual_adjust_count: { type: integer, description: 累计人工调整笔数 }
        unlocked_total: { type: integer }
        achievement_count: { type: integer }
        tasks_completed_today: { type: integer }
        task_participants_today: { type: integer }
        level_distribution:
          type: array
          items:
            type: object
            properties:
              level: { type: integer }
              count: { type: integer }
        total_rules: { type: integer }
        total_tasks: { type: integer }

    AdminGrowthUserSummary:
      type: object
      required:
        - user_id
        - user_no
        - username
        - nickname
        - role
        - is_active
        - level
        - level_title
        - is_overridden
        - active_days
        - guest_active_days
        - current_xp
        - lifetime_earned_xp
        - lifetime_reversed_xp
        - achievement_count
        - gift_balance
        - gift_general_balance
        - gift_checkin_balance
        - created_at
      properties:
        user_id: { type: string, format: uuid }
        user_no: { type: string, example: U7K3M2QX9F, description: 对外随机用户 ID }
        username: { type: string }
        nickname: { type: string }
        role: { type: string, enum: [user, editor, admin] }
        is_active: { type: boolean }
        level: { type: integer, minimum: 0, description: 当前展示等级（可能来自人工覆盖） }
        level_title: { type: string }
        is_overridden: { type: boolean, description: 当前等级是否由后台人工直接覆盖 }
        active_days: { type: integer, description: 累计活跃天数（封顶 guest_active_days） }
        guest_active_days: { type: integer, description: 脱离访客阶段所需活跃天数 }
        current_xp: { type: integer, format: int64 }
        lifetime_earned_xp: { type: integer, format: int64 }
        lifetime_reversed_xp: { type: integer, format: int64 }
        achievement_count: { type: integer, format: int64 }
        gift_balance: { type: integer, format: int64 }
        gift_general_balance: { type: integer, format: int64 }
        gift_checkin_balance: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

    AdminGrowthAchievementItem:
      type: object
      required: [id, code, name, description, category, rarity, reward_xp, unlocked_at, grant_source, is_public, definition_id]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        rarity: { type: string }
        reward_xp: { type: integer }
        unlocked_at: { type: string, format: date-time }
        grant_source: { type: string }
        is_public: { type: boolean }
        definition_id: { type: string, format: uuid }

    AdminGiftLedgerItem:
      type: object
      required: [id, amount, coin_type, balance_after, event_type, source_type, source_id, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer, format: int64, description: 正数增加，负数扣减 }
        coin_type: { type: string, enum: [general, checkin] }
        balance_after: { type: integer, format: int64, description: 对应币种变动后的余额 }
        event_type: { type: string }
        source_type: { type: string }
        source_id: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    AdminGrowthAuditItem:
      type: object
      required: [id, action, entity_type, entity_id, reason, operator_user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        reason: { type: string }
        operator_user_id: { type: string }
        created_at: { type: string, format: date-time }

    AdminGrowthUserDetail:
      type: object
      required:
        - user
        - base_level
        - level_override
        - next_level_xp
        - xp_to_next_level
        - level_progress_percent
        - is_max_level
        - achievement_total
        - experience_total
        - gift_total
        - audit_total
        - experience
        - achievements
        - gifts
        - audits
      properties:
        user: { $ref: "#/components/schemas/AdminGrowthUserSummary" }
        base_level: { type: integer, minimum: 0, description: 未应用人工覆盖时的自动等级 }
        level_override: { type: integer, minimum: 0, nullable: true, description: 人工覆盖等级；null 表示自动计算 }
        next_level_xp: { type: integer, format: int64, nullable: true, description: 下一级所需经验；满级为 null }
        xp_to_next_level: { type: integer, format: int64 }
        level_progress_percent: { type: integer, minimum: 0, maximum: 100 }
        is_max_level: { type: boolean }
        achievement_total: { type: integer, format: int64 }
        experience_total: { type: integer, format: int64 }
        gift_total: { type: integer, format: int64 }
        audit_total: { type: integer, format: int64 }
        experience:
          type: array
          items: { $ref: "#/components/schemas/GrowthLedgerItem" }
        achievements:
          type: array
          items: { $ref: "#/components/schemas/AdminGrowthAchievementItem" }
        gifts:
          type: array
          items: { $ref: "#/components/schemas/AdminGiftLedgerItem" }
        audits:
          type: array
          items: { $ref: "#/components/schemas/AdminGrowthAuditItem" }

    GrowthRuleInput:
      type: object
      required: [name, event_type, xp_amount, enabled]
      properties:
        name: { type: string, maxLength: 150 }
        event_type: { type: string, description: 必须在服务端允许列表内 }
        xp_amount: { type: integer, minimum: 0 }
        daily_limit: { type: integer, nullable: true, minimum: 1 }
        per_subject_limit: { type: integer, nullable: true, minimum: 1 }
        enabled: { type: boolean }
        effective_from: { type: string, format: date-time, nullable: true }
        effective_until: { type: string, format: date-time, nullable: true }

    GrowthLevelConfig:
      type: object
      required: [max_level, step_xp]
      properties:
        max_level: { type: integer, minimum: 0, maximum: 2147483647, default: 0, description: 等级上限；0 表示不设上限，Lv.1 起按经验曲线连续存在 }
        step_xp: { type: integer, format: int64, minimum: 1, maximum: 1000000000, default: 100, description: 每级递增值；达到 Lv.N 所需经验 = step_xp × N × (N-1) / 2 }
        updated_at: { type: string, format: date-time }

    GrowthLevelConfigInput:
      type: object
      required: [max_level, step_xp]
      properties:
        max_level: { type: integer, minimum: 0, maximum: 2147483647, description: 0 表示不设等级上限 }
        step_xp: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }

    GrowthLevelTitle:
      type: object
      required: [id, min_level, max_level, title, enabled]
      properties:
        id: { type: string, format: uuid }
        min_level: { type: integer, minimum: 0 }
        max_level: { type: integer, minimum: 0 }
        title: { type: string, maxLength: 100 }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GrowthLevelTitleInput:
      type: object
      required: [min_level, max_level, title]
      properties:
        min_level: { type: integer, minimum: 0, description: 区间起点；与 max_level 相同表示指定等级称号 }
        max_level: { type: integer, minimum: 0, description: 区间终点；必须 >= min_level；当前 max_level=0 时仅受整数范围限制 }
        title: { type: string, maxLength: 100 }
        enabled: { type: boolean, default: true }

    GrowthTaskInput:
      type: object
      required: [name, event_type, target_count, reward_xp, enabled]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string }
        event_type: { type: string, description: 必须在服务端允许列表内 }
        target_count: { type: integer, minimum: 1 }
        reward_xp: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        sort_order: { type: integer }

    GrowthAchievementInput:
      type: object
      required: [name, category, condition_type, target_value, enabled]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string }
        category: { type: string, maxLength: 50 }
        rarity: { type: string, enum: [common, rare, epic, legendary] }
        icon_url: { type: string, description: 空串、https:// 或站内 / 开头路径 }
        condition_type: { type: string, enum: [event_count, distinct_subject_count, level_reached, daily_task_days] }
        condition_event_type: { type: string, description: event_count / distinct_subject_count 时必填 }
        condition_subject_type: { type: string }
        target_value: { type: integer, minimum: 1 }
        reward_xp: { type: integer, minimum: 0 }
        is_hidden: { type: boolean }
        enabled: { type: boolean }
        sort_order: { type: integer }

    ResourceInput:
      type: object
      description: 资源创建/更新入参（更新时 `id` 必填，其余字段按需提交）
      required: [slug, name, summary, resource_type, source_url, status]
      properties:
        slug: { type: string, description: URL 短标识，全局唯一 }
        name: { type: string }
        summary: { type: string }
        description: { type: string }
        resource_type: { type: string, enum: [mod, modpack, resource_pack, shader, world, datapack, plugin] }
        cover_image_url: { type: string }
        author_name: { type: string }
        source_platform: { type: string }
        source_url: { type: string, format: uri }
        license: { type: string }
        game_edition: { type: string, enum: [java, bedrock] }
        supported_versions: { type: array, items: { type: string } }
        loader_types:
          type: array
          items: { type: string, enum: [forge, neoforge, fabric, quilt, vanilla, paper, spigot, purpur, other] }
        dependencies: { type: array, items: { type: object } }
        install_guide: { type: string }
        tags: { type: array, items: { type: string } }
        compatibility_note: { type: string }
        status: { type: string, enum: [draft, published, hidden] }
    ToolInput:
      type: object
      description: 工具创建/更新入参（更新时 `id` 必填）
      required: [slug, name, summary, category]
      properties:
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        description: { type: string }
        category: { type: string, enum: [查询类, 计算类, 生成类, 编辑类, 辅助类] }
        icon: { type: string }
        tags: { type: array, items: { type: string } }
        supported_versions: { type: array, items: { type: string } }
        input_schema: { type: array, items: { type: object } }
        output_schema: { type: array, items: { type: object } }
        is_featured: { type: boolean }
        sort_order: { type: integer }
        status: { type: string, enum: [draft, published, hidden] }
    WikiInput:
      type: object
      description: 百科创建/更新入参（更新时 `id` 必填）
      required: [slug, title, content]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        content: { type: string }
        content_format: { type: string, enum: [markdown, html, plaintext] }
        content_type: { type: string, enum: [wiki, guide, reference] }
        game_edition: { type: string, enum: [java, bedrock] }
        game_versions: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        source_references: { type: array, items: { type: object } }
        status: { type: string, enum: [draft, published, hidden] }
    CategoryInput:
      type: object
      required: [name, slug, content_type]
      properties:
        id: { type: string, format: uuid, description: 更新时必填 }
        name: { type: string }
        slug: { type: string }
        content_type: { type: string, enum: [tool, resource, wiki] }
        sort_order: { type: integer }
    TagInput:
      type: object
      description: 标签创建/更新入参（创建时 name 或 slug 至少一个）
      properties:
        id: { type: string, format: uuid, description: 更新时必填 }
        name: { type: string }
        slug: { type: string }

    CommunityAuthor:
      type: object
      description: 社区作者公开信息（不含内部 UUID、邮箱等隐私字段）
      required: [user_no, username, nickname]
      properties:
        user_no: { type: string, example: U7K3M2QX9F, description: 对外随机用户 ID }
        username: { type: string }
        nickname: { type: string }
    CommunityPost:
      type: object
      description: 社区帖子（status = hidden 时仅后台可见）
      required: [id, category, title, body, status, author, like_count, comment_count, liked]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [chat, help, showcase, tutorial] }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [published, hidden] }
        author: { $ref: "#/components/schemas/CommunityAuthor" }
        like_count: { type: integer }
        comment_count: { type: integer }
        liked: { type: boolean, description: 当前查看者是否已点赞；匿名为 false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CommunityComment:
      type: object
      description: 帖子留言
      required: [id, post_id, body, status, author, created_at]
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        post_title: { type: string, description: 所属帖子标题（后台跨帖列表返回） }
        body: { type: string }
        status: { type: string, enum: [published, hidden] }
        author: { $ref: "#/components/schemas/CommunityAuthor" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

  requestBodies:
    SearchQuery:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              q: { type: string, maxLength: 80, description: 关键词（超长返回 422） }
              type: { type: string, enum: [tool, resource, wiki, item, devdoc], description: devdoc 为开发文档（TODO §21） }
              game_version:
                type: string
                description: |-
                  按游戏版本筛选（TODO §5 / §6-C）：具体版本会命中声明该版本或声明通配 all 的结果；
                  all 仅命中声明了通配的资源；不传表示不限版本。
              sort:
                type: string
                enum: [relevance, updated_desc]
                description: 排序方式，默认 relevance（相关度）
              page: { type: integer, minimum: 1 }
              page_size: { type: integer, minimum: 1, maximum: 50 }
    ResourceListQuery:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              q: { type: string }
              type: { type: string }
              game_version:
                type: string
                description: |-
                  按游戏版本筛选（TODO §6-C）：具体版本会命中声明该版本或声明通配 all 的资源；
                  all 仅命中声明了通配的资源；不传表示不限版本。
              loader: { type: string }
              source_platform: { type: string }
              tag:
                type: string
                description: |-
                  按标签精确筛选（走 resource_tags 关联表，可走索引）；
                  与 `tags::text LIKE` 的模糊匹配不同，这里只命中真正带有该标签的资源。
              sort: { type: string, enum: [updated_desc, name_asc] }
              page: { type: integer, minimum: 1 }
              page_size: { type: integer, minimum: 1, maximum: 50 }

  responses:
    Envelope:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {}
    PagedEnvelope:
      description: 成功（含分页 meta）
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: {} }
              meta: { $ref: "#/components/schemas/PageMeta" }
    BadRequest:
      description: 请求体格式错误（400）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: 参数校验失败（422）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在（404）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 唯一性冲突（409）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 未登录（401）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 权限不足（403）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: 上游（Mojang API）错误（502）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: 请求过于频繁，触发限流（429）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: 依赖不可用（503）——数据源未加载，或共享会话存储不可用（安全失败，拒绝请求）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
