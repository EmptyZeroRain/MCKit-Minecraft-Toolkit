      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkin_reward: { type: integer, minimum: 0, maximum: 1000000 }
                base_xp: { type: integer, minimum: 0, maximum: 1000000 }
                streak_step_xp: { type: integer, minimum: 0, maximum: 1000000 }
                streak_bonus_cap: { type: integer, minimum: 0, maximum: 1000000 }
                milestone_bonus_cap: { type: integer, minimum: 0, maximum: 1000000 }
                break_penalty_xp: { type: integer, minimum: 0, maximum: 1000000 }
                makeup_card_price: { type: integer, minimum: 1, maximum: 1000000 }
                milestones:
                  type: array
                  items: { $ref: "#/components/schemas/GiftCheckinMilestoneInput" }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

