        wallet: { $ref: "#/components/schemas/GiftWallet" }

    GiftSettings:
      type: object
      properties:
        checkin_reward: { type: integer, description: 每日签到礼物币 }
        base_xp: { type: integer, description: 每次签到 / 补签基础经验 }
        streak_step_xp: { type: integer, description: 连续签到每多 1 天增加的经验 }
        streak_bonus_cap: { type: integer, description: 单次签到连续奖励上限 }
        milestone_bonus_cap: { type: integer, description: 单次签到里程碑奖励合计上限 }
        break_penalty_xp: { type: integer, description: 断签后首次真实签到扣除的经验 }
        makeup_card_price: { type: integer, description: 补签卡价格（签到礼物币） }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/GiftCheckinMilestone" }
