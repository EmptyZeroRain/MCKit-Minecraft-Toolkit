        video_url: { type: string }
        world_download_url: { type: string, description: 存档下载地址；非空时 license 必填（版权红线） }
        world_download_note: { type: string }
        license: { type: string, description: 存档授权协议；world_download_url 非空时必填 }
        license_note: { type: string }
        supported_versions: { type: array, items: { type: string } }
