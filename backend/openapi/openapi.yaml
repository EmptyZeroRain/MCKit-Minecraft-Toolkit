  /admin/wiki/create:
    post: { tags: [admin], summary: 创建百科, security: [{ cookieAuth: [] }], parameters: [{ $ref: "#/components/parameters/CsrfToken" }], responses: { "201": { $ref: "#/components/responses/Envelope" } } }
  /admin/wiki/update:
