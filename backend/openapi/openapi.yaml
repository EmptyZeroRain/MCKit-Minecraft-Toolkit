  /admin/users/export:
    post:
      tags: [admin]
      summary: 导出普通用户 CSV（需 accounts.users；按当前筛选，不分页）
      description: |
        返回 `text/csv` 附件（带 UTF-8 BOM，便于 Excel 打开中文），列含用户ID / 用户名 / 状态 / 注册时间 / 最后登录 / 个人数据计数。
        单次导出上限 10000 条，超出时响应头 `X-Export-Truncated: true`。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 用户名模糊匹配 }
                status: { type: string, enum: [active, disabled], description: 省略表示不限 }
      responses:
        "200":
          description: CSV 附件
          headers:
            X-Export-Truncated:
              schema: { type: boolean }
              description: 是否因超出单次导出上限被截断
          content:
            text/csv:
              schema: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ===== 统一账号管理（普通用户 + 后台账号同一列表）=====
  # 旧接口 /admin/admins/* 与 /admin/users/* 保留兼容；新前端统一调用本组接口。
  # 路由层只要求 accounts.admins 或 accounts.users 之一，处理器按目标账号角色二次校验：
  #   role = 'user' → accounts.users；role <> 'user' → accounts.admins；
  #   分配后台角色 / 解绑 MFA → 一律要求 accounts.admins。
  /admin/accounts/list:
    post:
      tags: [admin]
      summary: 统一账号列表（普通用户与后台账号）
      description: |
        `scope` 为空表示全部（需同时具备两个权限点）；`admin` 仅后台账号；`user` 仅普通用户。
        仅具备单个权限点时自动收敛到对应范围，显式请求无权限范围返回 403。
        支持用户名 / 用户 ID 模糊匹配（`q`）与状态筛选（`status`）。
        每条附带 `email` / `gift_coins` / `level`（邮箱、礼物币余额、有效成长等级，
        等级优先取后台覆盖值）；收藏、最近使用、常用种子仅出现在详情接口。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 用户名 / 用户 ID 模糊匹配 }
                status: { type: string, enum: [active, disabled], description: 省略表示不限 }
                scope: { type: string, enum: [admin, user], description: 省略表示全部（需两个权限点） }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { $ref: "#/components/responses/PagedEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/accounts/create:
    post:
      tags: [admin]
      summary: 创建账号（普通用户或后台角色；按角色校验用户名与密码策略）
      description: |
        `role` 省略或为 `user` 时创建普通用户（用户名 3-40 位、密码 ≥8 位）；
        其余角色必须已存在于 `roles` 表（用户名 1-80 位、密码 ≥12 位）。
        创建普通用户需 `accounts.users`；创建后台角色需 `accounts.admins`。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 80 }
                password: { type: string, maxLength: 128 }
                role: { type: string, description: 省略表示普通用户（user） }
      responses:
        "201": { $ref: "#/components/responses/Envelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/accounts/detail:
    post:
      tags: [admin]
      summary: 账号详情（含收藏 / 最近使用 / 常用种子明细）
      description: |
        明细列表受个人数据容量上限约束（收藏 ≤500、最近使用 ≤50、常用种子 ≤200），
        因此一次性返回，不再分页。按目标账号角色校验 accounts.users / accounts.admins。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UnifiedAccountDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/accounts/update:
    post:
      tags: [admin]
      summary: 修改账号角色 / 启用状态（改角色或停用后会话立即失效）
      description: |
        支持普通用户 ↔ 后台角色。提升为后台角色时设置 `must_change_password`，
        要求下次登录先改密；降级为普通用户会撤销全部后台权限。
        目标账号为后台账号、或要把账号改为后台角色时，需要 `accounts.admins`。
        不可停用自己，不可降级 / 移除最后一名启用状态的 admin。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
                role: { type: string, description: '目标角色；user 表示降级为普通用户' }
                is_active: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/accounts/reset-password:
    post:
      tags: [admin]
      summary: 重置账号密码（按目标角色校验密码策略；成功后该账号会话全部失效）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, new_password]
              properties:
                id: { type: string, format: uuid }
                new_password: { type: string, maxLength: 128 }
      responses:
        "204": { description: 已重置 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/accounts/delete-preview:
    post:
      tags: [admin]
      summary: 删除账号的影响预览（只读，不执行删除）
      description: 返回将一并清理的个人数据、活动会话，以及是否删除自己 / 最后一名 admin。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200":
          description: 影响预览
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UnifiedAccountDeletePreview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/accounts/delete:
    post:
      tags: [admin]
      summary: 删除账号（物理删除，个人数据一并清除；不可删除自己或最后一名 admin）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "204": { description: 已删除 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/accounts/mfa/reset:
    post:
      tags: [admin]
      summary: 解绑指定后台账号的 MFA（需 accounts.admins）
      description: |
        用于管理员更换手机且恢复码丢失的场景，写审计（account.mfa.reset）。
        解绑后该账号登录只需密码，建议通知本人尽快重新绑定。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
