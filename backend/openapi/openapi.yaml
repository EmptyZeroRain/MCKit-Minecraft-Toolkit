  /mcsrc/status:
    post:
      tags: [mcsrc]
      summary: 查询某版本 jar 的缓存与索引状态（公开只读）
      description: |
        返回该版本（侧别）是否已缓存官方 jar、是否已建立类索引，以及体积 / 类数量 / 时间。
        jar 由服务端统一下载缓存，避免每个访客各自下载数百 MB。
        若该版本正在准备（下载 jar / 建索引），还会返回进行中的进度：
        `preparing` / `phase`（`downloading` | `indexing`）/ `downloaded` / `total`，
        前端据此渲染进度条（`total` 为 0 表示进度未知，按不确定进度展示）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, description: "MC 版本号，如 1.21.4" }
                side: { type: string, enum: [client, server], description: 默认 client }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mcsrc/prepared:
    post:
      tags: [mcsrc]
      summary: 已缓存的版本列表（公开只读）
      responses:
        "200": { $ref: "#/components/responses/Envelope" }

  /mcsrc/classes/list:
    post:
      tags: [mcsrc]
      summary: 类索引检索（公开只读）
      description: |
        在已建立索引的版本中检索类。匹配大小写不敏感，相关度排序：
        简单名相等 > 简单名前缀 > 简单名包含 > 全限定名包含。
        未建立索引时返回 409 `NEED_PREPARE`。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server] }
                q: { type: string, description: 关键词（匹配简单名与全限定名） }
                pkg: { type: string, description: 包名前缀过滤 }
                include_inner: { type: boolean, description: 是否包含内部类（默认 false） }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 200, description: 默认 50 }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "409":
          description: 该版本尚未建立类索引（`NEED_PREPARE`）
        "422": { $ref: "#/components/responses/ValidationError" }

  /mcsrc/classes/detail:
    post:
      tags: [mcsrc]
      summary: 类结构视图（公开只读）
      description: |
        返回单个类的结构：修饰符、种类（class / interface / enum / annotation）、class 文件版本、
        父类与直接接口、字段与方法（描述符已渲染为 Java 类型，如 `(Ljava/lang/String;I)V` → `void m(java.lang.String, int)`）。
        仅解析该类的 class 字节码（不反编译、不依赖 JVM），与 jar 体积无关。
        `in_jar_super` / `in_jar_interfaces` 表示父类 / 接口是否也在本 jar 内（可在前端继续下钻）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version, class]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server] }
                class: { type: string, description: "全限定类名（点分或斜杠分隔均可）" }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "404": { description: "该版本尚未缓存 jar（`NOT_FOUND`），或类不在 jar 中（`CLASS_NOT_FOUND`）" }
        "413": { description: "class 条目超出解析上限（`CLASS_TOO_LARGE`）" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mcsrc/classes/hierarchy:
    post:
      tags: [mcsrc]
      summary: 类继承关系（公开只读）
      description: |
        返回祖先链（直接父类逐级向上，直至跳出本 jar 的终点，如 `java.lang.Object`）与
        直接子类（含实现本接口的类，最多 500 个，超出时 `truncated=true`），
        并给出直接子类总数与递归子类总数。
        首次调用需扫描本 jar 内全部 class 建立关系索引（按 jar 摘要缓存于内存），之后为毫秒级。
        该版本已缓存 jar 但未建类索引时返回 409 `NEED_PREPARE`。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version, class]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server] }
                class: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "404": { description: "该版本尚未缓存 jar（`NOT_FOUND`），或类不在 jar 中（`CLASS_NOT_FOUND`）" }
        "409":
          description: 该版本尚未建立类索引（`NEED_PREPARE`）
        "422": { $ref: "#/components/responses/ValidationError" }

  /mcsrc/classes/bytecode:
    post:
      tags: [mcsrc]
      summary: 类字节码反汇编（公开只读）
      description: |
        返回单个类的字节码反汇编文本（ASM Textifier 风格）：类头（版本 / 访问标志 / 修饰符 /
        SOURCEFILE / SIGNATURE 等）、字段、方法，以及 `Code` 属性内的指令 / 标签 / 行号 /
        局部变量表 / 异常表。纯 Go 解析 class 字节码，**不反编译、不依赖 JVM**，只读单个 class 条目。
        首次调用与 jar 体积无关（仅读单个条目）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version, class]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server] }
                class: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "404": { description: "该版本尚未缓存 jar（`NOT_FOUND`），或类不在 jar 中（`CLASS_NOT_FOUND`）" }
        "413": { description: "class 条目超出解析上限（`CLASS_TOO_LARGE`）" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mcsrc/classes/references:
    post:
      tags: [mcsrc]
      summary: 查找引用（公开只读）
      description: |
        查找对某个类 / 方法 / 字段的引用。`kind` 取 `class`（默认）/ `method` / `field`；
        `method` / `field` 需提供 `name` 与 `descriptor`。

        首次调用需扫描本 jar 内全部 class 的常量池与指令建立**反向引用索引**
        （按 jar 摘要缓存于内存），之后为毫秒级。只返回**目标类位于本 jar 内**的引用
        （jar 外类无法跳转）。引用点按类名 / 成员排序并去重，`truncated=true` 表示引用点过多被截断。
        该版本已缓存 jar 但未建类索引时返回 409 `NEED_PREPARE`。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version, class]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server] }
                kind: { type: string, enum: [class, method, field], default: class }
                class: { type: string }
                name: { type: string, description: "成员名（kind 为 method / field 时必填）" }
                descriptor: { type: string, description: "JVM 描述符（如 ()V 或 I）" }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "404": { description: "该版本尚未缓存 jar（`NOT_FOUND`），或目标类不在 jar 中（`CLASS_NOT_FOUND`）" }
        "409": { description: "该版本尚未建立类索引（`NEED_PREPARE`）" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mcsrc/classes/mapping:
    post:
      tags: [mcsrc]
      summary: 类映射重命名（公开只读）
      description: |
        按 MC 版本 + jar 内类名反查已导入的版本映射，返回类与成员的可读名（映射重命名）。

        与其它 mcsrc 接口不同，本接口**只读数据库中的映射数据**（不读 jar、不建索引），
        因此不受「是否已建类索引」约束。该版本没有导入映射数据集、或没有数据集覆盖该类时
        返回 `available=false`（正常状态，前端据此隐藏映射名），而非 404。

        匹配顺序：先按 `obf_name`（jar 通常为混淆名），再回退 `named_name` / `mid_name`
        （jar 若已反混淆或使用中间名也能命中）；类名同时尝试点分全限定名与内部名（`/` 分隔）。
        多个数据集命中时按映射类型优先级选取（`mojang` > `tsrg` > `yarn` > `srg` > 其它）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version, class]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server] }
                class: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mcsrc/jar:
    post:
      tags: [mcsrc]
      summary: 下发已缓存的 jar（公开只读）
      description: |
        以二进制流返回服务端已缓存的官方 jar，供前端在**浏览器内**用 Vineflower（WASM）
        反编译源码——无需部署侧 JVM，也不把 jar 纳入仓库或数据库。

        与项目约定一致走 **POST + JSON body**（不再使用 GET + Range / ETag）：
        代价是浏览器不再缓存响应，故响应头回传 jar 的官方 sha1
        （`X-Mcsrc-Jar-Sha1`），前端据此把 jar 字节持久化到 IndexedDB，跨刷新复用；
        摘要变化（服务端重新准备）时前端自动重新下载。
        该版本尚未缓存时返回 404，且**不会**触发下载。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server], default: client }
      responses:
        "200":
          description: "jar 字节流（`Content-Type: application/java-archive`，含 `Content-Length` 与 `X-Mcsrc-Jar-Sha1`）"
          content:
            application/java-archive:
              schema: { type: string, format: binary }
        "404": { description: 该版本尚未缓存 jar（`NOT_FOUND`） }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: 触发重接口限流（`RATE_LIMITED`） }

  /mcsrc/prepare:
    post:
      tags: [mcsrc]
      summary: 下载 jar 并建立类索引（公开，受自动准备额度限制）
      description: |
        触发服务端下载官方 jar（校验官方 sha1）并建立类索引，幂等：已缓存且摘要一致时直接返回。
        前端在用户**选中版本时自动调用**（与上游 mcsrc 一致，无需手动「准备」按钮）。

        为避免任意访客逐个版本把磁盘与带宽吃满，匿名 / 普通访客受自动准备额度约束
        （`MCSRC_AUTO_PREPARE_MAX`，默认 12 个 version+side）：

        - 额度用尽 → 429 `AUTO_PREPARE_LIMIT`；
        - 额度为 0（关闭自动准备）→ 429 `AUTO_PREPARE_DISABLED`；
        - 已缓存 jar（仅缺索引）不消耗额度（只是重建索引，不产生新的磁盘占用）；
        - 具备 `ops.mcsrc` 权限的管理员不受额度限制。

        单次可达数百 MB，因此仍叠加限流与并发上限（同一时刻只允许一个准备任务，
        并发冲突时返回 429 `RATE_LIMITED`，前端会退避重试）。
        进度可通过 `/mcsrc/status` 轮询（`preparing` / `phase` / `downloaded` / `total`）。
      security:
        - cookieAuth: []
        - {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server], description: 默认 client }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "404": { description: "版本不存在，或该版本缺少对应侧别的下载地址（`NO_DOWNLOAD`）" }
        "413": { description: "jar 体积超过上限（`JAR_TOO_LARGE`）" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: "自动准备额度用尽 / 已关闭（`AUTO_PREPARE_LIMIT` / `AUTO_PREPARE_DISABLED`），或并发上限冲突（`RATE_LIMITED`）"
        "502": { description: "上游下载失败或 sha1 校验不符（`JAR_CHECKSUM_MISMATCH`）" }

  # ===== 用户成长（growth，jingyan.md）=====
  /growth/overview:
    post:
      tags: [growth]
      summary: 本人成长概览
      description: |
        返回当前有效经验、等级与称号、升级进度、今日任务完成数、今日经验与成就统计。
        **等级仅用于展示，不参与任何权限判定**。所有数值由服务端依据经验账本计算。

        等级规则：新用户默认 Lv.0「访客」，累计满 7 个活跃日后进入 Lv.1 经验等级。
        活跃日按业务时区统计，每个自然日至少产生一个成长事件（登录 / 收藏 / 工具使用等）计 1 天；
        只读页面刷新不会增加活跃天数。Lv.0 的进度按活跃天数展示，不展示经验升级目标。
        后台人工覆盖等级时 `is_level_overridden=true`，经验继续累积但不会自动改级。
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 成长概览
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GrowthOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /growth/ledger:
    post:
      tags: [growth]
      summary: 本人经验流水（分页，倒序）
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageQuery" }
      responses:
        "200":
          description: 经验流水（含分页 meta）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GrowthLedgerItem" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /growth/daily-tasks:
    post:
      tags: [growth]
      summary: 今日每日任务
      description: 返回业务日期、时区与任务进度。达到目标即由服务端自动发奖，**没有领取接口**。
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 今日任务
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      date: { type: string, description: 业务日期（YYYY-MM-DD） }
                      timezone: { type: string, description: 站点业务时区 }
                      tasks:
                        type: array
                        items: { $ref: "#/components/schemas/GrowthDailyTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /growth/daily-tasks/history:
    post:
      tags: [growth]
      summary: 历史每日任务记录（分页）
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageQuery" }
      responses:
        "200": { $ref: "#/components/responses/PagedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /growth/achievements:
    post:
      tags: [growth]
      summary: 成就目录（含本人解锁状态与进度）
      description: 未解锁的隐藏成就只返回占位信息，不泄露名称、描述、条件与奖励。
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 成就目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/GrowthAchievement" }
                      total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /public/users/detail:
    post:
      tags: [growth]
      summary: 公开个人主页成长摘要
      description: 仅返回等级 / 称号 / 当前经验 / 成就数，不含经验流水、登录时间与风险标记。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: 公开摘要
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GrowthPublicProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /public/users/achievements:
    post:
      tags: [growth]
      summary: 公开个人主页成就
      description: 仅返回用户选择公开的成就快照。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: 公开成就
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/GrowthUserAchievement" } }
                      total: { type: integer }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/growth/overview:
    post:
      tags: [growth]
      summary: 后台成长概览（需 ops.growth）
      description: |
        统计口径：发放经验仅计正向流水；今日奖励笔数 = 今日正向流水条数；
        冲正经验为 reversal 流水绝对值合计；人工调整笔数为 manual 流水条数。
        不得将事件数量直接等同于奖励笔数。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: 概览与等级分布
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminGrowthOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/growth/users/list:
    post:
      tags: [growth]
      summary: 用户成长列表（需 ops.growth）
      description: 分页查询全部账号（含后台账号）的成长摘要，可按用户名 / 昵称 / 对外用户 ID 搜索。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: 用户名 / 昵称 / 对外用户 ID 模糊搜索 }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 用户成长摘要分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminGrowthUserSummary" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/growth/users/detail:
    post:
      tags: [growth]
      summary: 单用户成长详情（需 ops.growth）
      description: 返回等级、经验、成就、礼物币流水与成长审计日志的聚合数据。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, description: 内部 UUID 或对外用户 ID（如 U7K3M2QX9F） }
      responses:
        "200":
          description: 单用户成长详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminGrowthUserDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/growth/ledger/list:
    post:
      tags: [growth]
      summary: 全局经验流水（需 ops.growth）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string, description: 内部 UUID 或对外用户 ID，可留空 }
                rule_code: { type: string }
                source_type: { type: string, enum: [rule, daily_task, achievement, manual, reversal] }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { $ref: "#/components/responses/PagedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/growth/adjust:
    post:
      tags: [growth]
      summary: 人工调整经验（需 ops.growth，高风险）
      description: 正负均可，必须填写原因；`request_key` 为客户端幂等键，重复提交不重复生效。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id, delta_xp, reason]
              properties:
                target_user_id: { type: string, description: 内部 UUID 或对外用户 ID（如 U7K3M2QX9F） }
                delta_xp: { type: integer, description: 非 0，正负均可 }
                reason: { type: string }
                request_key: { type: string, description: 幂等键（可选） }
      responses:
        "200":
          description: 生成的流水
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GrowthLedgerItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/growth/reverse:
    post:
      tags: [growth]
      summary: 冲正经验流水（需 ops.growth）
      description: 生成等额负向流水，原始流水永久保留；同一流水只能冲正一次。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, reason]
              properties:
                id: { type: string, format: uuid, description: 原流水 ID }
                reason: { type: string }
      responses:
        "200":
          description: 冲正流水
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GrowthLedgerItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/growth/audit/list:
    post:
      tags: [growth]
      summary: 成长审计日志（需 ops.growth）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operator_id: { type: string, format: uuid }
                target_user_id: { type: string, format: uuid }
                action: { type: string }
                page: { type: integer, minimum: 1 }
                page_size: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { $ref: "#/components/responses/PagedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/growth/rules/list:
    post:
      tags: [growth]
      summary: 经验规则列表（需 ops.growth）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/growth/rules/create:
    post:
      tags: [growth]
      summary: 新建经验规则（需 ops.growth）
      description: 编码由系统自动生成；事件类型必须在服务端允许列表内。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrowthRuleInput" }
      responses:
        "201": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/growth/rules/update:
    post:
      tags: [growth]
      summary: 更新经验规则（版本化，需 ops.growth）
      description: 不原地改写历史含义，而是新建 `version+1` 的规则；历史流水的 rule_version 仍可追溯。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
                - $ref: "#/components/schemas/GrowthRuleInput"
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/growth/rules/toggle:
    post:
      tags: [growth]
      summary: 启用 / 停用经验规则（需 ops.growth）
      description: 按规则停用 / 启用其全部版本。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToggleBody" }
      responses:
        "204": { description: 已更新 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/growth/rules/delete:
    post:
      tags: [growth]
      summary: 删除经验规则（需 ops.growth）
      description: 删除某编码的全部版本；已被经验账本引用时拒绝（409）。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
