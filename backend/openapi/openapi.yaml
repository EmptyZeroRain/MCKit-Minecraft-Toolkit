      summary: 按天趋势（admin 专属，TODO §13）
      description: 区间内每一天都存在（缺失日期补零），便于前台绘制连续折线。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsRange" }
      responses:
        "200":
          description: 成功（按日期升序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UsageTrendPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/resources/list:
    post:
      tags: [admin]
      summary: 资源列表（含草稿/下架）
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { $ref: "#/components/responses/PagedEnvelope" }
  /admin/resources/detail:
    post:
      tags: [admin]
