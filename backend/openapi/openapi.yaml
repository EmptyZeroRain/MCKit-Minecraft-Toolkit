  /admin/mcsrc/cache/list:
    post:
      tags: [admin]
      summary: MC 源码缓存列表（需 ops.mcsrc 权限）
      description: |
        列出服务端已缓存的 MC 源码 jar（`version + side`）及其磁盘占用
        （jar / 索引 / 元数据分项与合计）。jar 与索引均为**可重建的派生数据**，
        清理不会影响业务数据，仅导致下次准备重新下载 / 建索引。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            version: { type: string }
                            side: { type: string, enum: [client, server] }
                            cached: { type: boolean }
                            size: { type: integer, description: jar 字节数 }
                            sha1: { type: string }
                            indexed: { type: boolean }
                            class_count: { type: integer }
                            index_size: { type: integer }
                            meta_size: { type: integer }
                            total_size: { type: integer }
                            fetched_at: { type: string, format: date-time, nullable: true }
                            index_built_at: { type: string, format: date-time, nullable: true }
                      usage:
                        type: object
                        properties:
                          entries: { type: integer }
                          jar_bytes: { type: integer }
                          index_bytes: { type: integer }
                          meta_bytes: { type: integer }
                          total_bytes: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: 源码库未启用（`MCSRC_ENABLED=false`） }
  /admin/mcsrc/cache/preview:
    post:
      tags: [admin]
      summary: 清理源码缓存的影响预览（需 ops.mcsrc 权限）
      description: >
        返回目标版本的 jar / 索引 / 元数据占用、预计释放空间、待删文件清单，
        以及是否正在准备（下载 / 建索引）。只读计算，不执行删除、不写审计。
        正在准备的版本清理会被拒绝（409 CACHE_BUSY）。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server] }
      responses:
        "200":
          description: 影响预览
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      version: { type: string }
                      side: { type: string }
                      cached: { type: boolean }
                      jar_bytes: { type: integer }
                      index_bytes: { type: integer }
                      meta_bytes: { type: integer }
                      total_bytes: { type: integer }
                      preparing: { type: boolean }
                      rebuildable: { type: boolean }
                      files:
                        type: array
                        items: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: 源码库未启用（`MCSRC_ENABLED=false`） }
  /admin/mcsrc/cache/purge:
    post:
      tags: [admin]
      summary: 清理单个版本的源码缓存（需 ops.mcsrc 权限）
      description: 删除指定 `version + side` 的 jar / 索引 / 元数据；未缓存该版本返回 404。属运维动作，写审计日志（含释放字节数）。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server], default: client }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      version: { type: string }
                      side: { type: string }
                      freed_bytes: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/mcsrc/cache/rebuild:
    post:
      tags: [admin]
      summary: 重建单个版本的源码缓存（入队后台任务）
      description: |
        清理旧缓存 → 重新下载 jar → 重建类索引。该过程通常数十秒，
        因此接口只入队并立即返回 `job_id`，进度与失败原因在「后台任务」页查看，
        失败可直接重试。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                side: { type: string, enum: [client, server], default: client }
      responses:
        "201":
          description: 已入队
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id: { type: string, format: uuid }
                      type: { type: string }
                      version: { type: string }
                      side: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: 后台任务服务未启用（JOBS_UNAVAILABLE）

  /admin/mcsrc/cache/purge-all:
    post:
      tags: [admin]
      summary: 清空全部源码缓存（需 ops.mcsrc 权限，破坏性）
      description: |
        删除全部已缓存的 jar / 索引 / 元数据。**破坏性运维动作**（前端需二次确认）：
        所有访客下次访问源码浏览器时会重新触发下载与建索引。
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      purged: { type: integer, description: 成功清理的条目数 }
                      freed_bytes: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
