      allOf:
        - $ref: "#/components/schemas/Mob"
        - type: object
          properties:
            drops:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/MobDrop"
                  - type: object
                    properties:
                      item_ref:
                        description: 该掉落物在物品库中的摘要；未收录时为 null，前端回退为纯文本 ID
                        nullable: true
                        allOf: [{ $ref: "#/components/schemas/ItemRef" }]
            resolved_items:
              type: object
              description: 全部掉落引用到的、确实已收录的物品摘要（键为 item_id）
              additionalProperties: { $ref: "#/components/schemas/ItemRef" }
    RedstoneComponent:
