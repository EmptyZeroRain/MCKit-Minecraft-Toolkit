      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id]
              properties:
                target_user_id: { type: string, description: 内部 UUID 或对外用户 ID }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
