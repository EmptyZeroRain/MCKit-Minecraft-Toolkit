# MC 工具站编排文件：PostgreSQL + 后端 API + 前端 + 反向代理
# 开发环境：仅启动 PostgreSQL（见 scripts/dev.sh 或 docker compose up postgres）。
# 生产环境：docker compose --env-file ../.env up --build -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: mc_tools
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc_user -d mc_tools"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

configs:
  caddyfile:
    file: ./Caddyfile

volumes:
  pg_data: